<script>
function levenshtein(a, b) {
    var matrix = [];
    var i, j;
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    for (i = 0; i <= b.length; i++) { matrix[i] = [i]; }
    for (j = 0; j <= a.length; j++) { matrix[0][j] = j; }
    for (i = 1; i <= b.length; i++) {
        for (j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

function isSimilar(input, target) {
    if (!input || input.trim() === "") return false;
    let cleanInput = input.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    let cleanTarget = target.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    if (cleanInput === "" || cleanTarget === "") return false;
    if (cleanInput === cleanTarget) return true;
    let distance = levenshtein(cleanInput, cleanTarget);
    return distance <= (cleanTarget.length <= 4 ? 0 : 2);
}

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Fragen aufteilen: Test 1 (1-50), Test 2 (51-100)
let currentTest = 1;
let test1Questions = allQuestions.slice(0, 50);
let test2Questions = allQuestions.slice(50, 100);
let activeQuestions = [];

let currentQ = 0;
let score = 0;
let currentShuffledOptions = [];

function switchTest(testNum) {
    currentTest = testNum;
    document.getElementById("btn-test1").classList.toggle("active", testNum === 1);
    document.getElementById("btn-test2").classList.toggle("active", testNum === 2);
    
    activeQuestions = testNum === 1 ? test1Questions : test2Questions;
    currentQ = 0;
    score = 0;
    showQuestion();
}

function showQuestion() {
    const q = activeQuestions[currentQ];
    document.getElementById("progress").innerText = `Test ${currentTest} - Frage ${currentQ + 1} von ${activeQuestions.length}`;
    const container = document.getElementById("question-content");
    const feedback = document.getElementById("feedback-area");
    feedback.innerHTML = "";
    document.getElementById("next-btn").style.display = "none";

    let html = `<div class="question-text">${q.q}</div>`;

    if (q.type === "mc") {
        currentShuffledOptions = shuffleArray(q.options);
        html += `<div id="options-container">`;
        currentShuffledOptions.forEach((opt, idx) => {
            html += `<button class="option" onclick="checkMC(${idx})">${opt}</button>`;
        });
        html += `</div>`;
    } else if (q.type === "open") {
        html += `
            <input type="text" id="open-answer" class="text-input" placeholder="Antwort eingeben..." autocomplete="off">
            <button class="submit-btn" onclick="checkOpen()">Antwort prüfen</button>
        `;
    } else if (q.type === "table") {
        html += `<table class="kalkulation-table"><tr><th>Position</th><th>Wert (€)</th></tr>`;
        q.rows.forEach((row, idx) => {
            html += `<tr><td>${row.label}</td><td>`;
            if (row.readonly) {
                html += `<strong>${row.val}</strong>`;
            } else {
                html += `<input type="text" id="table-val-${idx}" placeholder="Wert eingeben" autocomplete="off">`;
            }
            html += `</td></tr>`;
        });
        html += `</table><button class="submit-btn" onclick="checkTable()">Tabelle prüfen</button>`;
    }

    container.innerHTML = html;
}

function checkMC(selectedIndex) {
    const q = activeQuestions[currentQ];
    const selectedOption = currentShuffledOptions[selectedIndex];
    const optionsBtns = document.querySelectorAll(".option");
    optionsBtns.forEach(btn => btn.disabled = true);

    if (selectedOption === q.answer) {
        optionsBtns[selectedIndex].classList.add("correct");
        score++;
        showFeedback(true, `Richtig! ${q.exp}`);
    } else {
        optionsBtns[selectedIndex].classList.add("incorrect");
        currentShuffledOptions.forEach((opt, idx) => {
            if (opt === q.answer) {
                optionsBtns[idx].classList.add("correct");
            }
        });
        showFeedback(false, `Falsch! Richtige Antwort: ${q.answer}. ${q.exp}`);
    }
    document.getElementById("next-btn").style.display = "inline-block";
}

function checkOpen() {
    const q = activeQuestions[currentQ];
    const inputEle = document.getElementById("open-answer");
    const input = inputEle ? inputEle.value : "";
    const btn = document.querySelector(".submit-btn");
    btn.disabled = true;

    if (!input || input.trim() === "") {
        showFeedback(false, `Keine Antwort eingegeben! Richtige Antwort: ${Array.isArray(q.answer) ? q.answer[0] : q.answer}. ${q.exp}`);
        document.getElementById("next-btn").style.display = "inline-block";
        return;
    }

    let isCorrect = false;
    if (Array.isArray(q.answer)) {
        isCorrect = q.answer.some(ans => isSimilar(input, ans));
    } else {
        isCorrect = isSimilar(input, q.answer);
    }

    if (isCorrect) {
        score++;
        showFeedback(true, `Richtig! ${q.exp}`);
    } else {
        showFeedback(false, `Falsch! Richtige Antwort: ${Array.isArray(q.answer) ? q.answer[0] : q.answer}. ${q.exp}`);
    }
    document.getElementById("next-btn").style.display = "inline-block";
}

function checkTable() {
    const q = activeQuestions[currentQ];
    let allCorrect = true;
    let hasEmpty = false;
    const btn = document.querySelector(".submit-btn");
    btn.disabled = true;

    q.rows.forEach((row, idx) => {
        if (!row.readonly) {
            const inputEle = document.getElementById(`table-val-${idx}`);
            const inputVal = inputEle ? inputEle.value : "";
            if (!inputVal || inputVal.trim() === "") {
                hasEmpty = true;
            }
            if (!isSimilar(inputVal, row.key)) {
                allCorrect = false;
            }
        }
    });

    if (!hasEmpty && allCorrect) {
        score++;
        showFeedback(true, `Alle Tabelleneinträge sind richtig! ${q.exp}`);
    } else {
        let answersText = q.rows.filter(r => !r.readonly).map(r => `${r.label}: ${r.key}`).join(" | ");
        showFeedback(false, `Falsch oder unvollständig! Richtige Werte: ${answersText}. ${q.exp}`);
    }
    document.getElementById("next-btn").style.display = "inline-block";
}

function showFeedback(isCorrect, text) {
    const feedback = document.getElementById("feedback-area");
    feedback.className = `feedback ${isCorrect ? 'feedback-correct' : 'feedback-incorrect'}`;
    
    const memeArray = isCorrect ? correctMemes : incorrectMemes;
    const randomMeme = memeArray[Math.floor(Math.random() * memeArray.length)];

    feedback.innerHTML = `
        <div>${text}</div>
        <div class="feedback-img">
            <img src="${randomMeme}" alt="Reaktion Bild">
        </div>
    `;
}

function nextQuestion() {
    currentQ++;
    if (currentQ < activeQuestions.length) {
        showQuestion();
    } else {
        finishQuiz();
    }
}

function getRangliste() {
    const data = localStorage.getItem(`lf02_rangliste_test${currentTest}`);
    if (data) {
        return JSON.parse(data);
    }
    return [
        { name: "Max Mustermann", score: 48, max: 50, date: "15.09.2026" },
        { name: "IT-Profi", score: 42, max: 50, date: "16.09.2026" }
    ];
}

function saveRanglisteEntry(name) {
    if (!name || name.trim() === "") return;
    let list = getRangliste();
    const today = new Date().toLocaleDateString('de-DE');
    list.push({
        name: name.trim(),
        score: score,
        max: activeQuestions.length,
        date: today
    });
    list.sort((a, b) => b.score - a.score);
    list = list.slice(0, 10);
    localStorage.setItem(`lf02_rangliste_test${currentTest}`, JSON.stringify(list));
    renderRangliste(name.trim());
}

function renderRangliste(highlightName = null) {
    const list = getRangliste();
    let html = `
        <table class="rangliste-table">
            <tr>
                <th>Rang</th>
                <th>Name</th>
                <th>Punkte</th>
                <th>Prozent</th>
                <th>Datum</th>
            </tr>
    `;
    list.forEach((item, index) => {
        const isCurrent = highlightName && item.name === highlightName && item.score === score;
        const rowClass = isCurrent ? 'class="highlight-row"' : '';
        const pct = Math.round((item.score / item.max) * 100);
        html += `
            <tr ${rowClass}>
                <td><strong>#${index + 1}</strong></td>
                <td>${item.name}</td>
                <td>${item.score} / ${item.max}</td>
                <td>${pct}%</td>
                <td>${item.date}</td>
            </tr>
        `;
    });
    html += `</table>`;
    document.getElementById("rangliste-table-container").innerHTML = html;
}

function finishQuiz() {
    const passed = score >= (activeQuestions.length / 2);
    
    const imgSrc = passed 
        ? "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExeTg2NGxudjlweDQzaWV0a3ljdmQwaDhwbWVpM250MTRqb3dpdDRjciZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3o7qE2VAxuXWeyvJIY/giphy.webp"
        : "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdzgxbGplZnkzdnFhanE2M3d5bDIybTZiN2J1Zm1qbzk4OHppdGdudyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l1J9u3TZfpmeDLkD6/giphy.gif";

    const nextActionBtn = (currentTest === 1)
        ? `<button class="submit-btn" onclick="switchTest(2)" style="margin-top:20px; background-color:#28a745;">Weiter zu Test 2 (Frage 51-100)</button>`
        : `<button class="submit-btn" onclick="switchTest(1)" style="margin-top:20px;">Zurück zu Test 1</button>`;

    document.getElementById("quiz-card").innerHTML = `
        <div id="score-board">
            <h2>Test ${currentTest} Beendet!</h2>
            <p style="font-size: 1.3em;">Ergebnis: <strong>${score}</strong> von <strong>${activeQuestions.length}</strong> Punkten (${Math.round(score/activeQuestions.length*100)}%)</p>
            <div class="img-container">
                <img src="${imgSrc}" alt="Ergebnis Bild">
            </div>
            <div class="meme-text">${passed ? 'Klasse Leistung! Du hast diesen Abschnitt bestanden! 🎉' : 'Das war leider nichts... Zeit für eine Wiederholung! 😭'}</div>
            
            <div class="rangliste-container">
                <h3>🏆 Rangliste für Test ${currentTest}</h3>
                <div class="rangliste-form" id="rangliste-form-box">
                    <input type="text" id="player-name" placeholder="Deinen Namen eintragen..." autocomplete="off">
                    <button class="submit-btn" style="margin-top:0;" onclick="submitScore()">In Rangliste eintragen</button>
                </div>
                <div id="rangliste-table-container"></div>
            </div>
            
            ${nextActionBtn}
        </div>
    `;
    
    renderRangliste();
}

function submitScore() {
    const nameInput = document.getElementById("player-name");
    if (nameInput && nameInput.value.trim() !== "") {
        saveRanglisteEntry(nameInput.value);
        document.getElementById("rangliste-form-box").style.display = "none";
    }
}

// Start mit Test 1
switchTest(1);
</script>

</body>
