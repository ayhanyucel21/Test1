const questions = [
    // 1-10
    { type: "mc", q: "1. Was ist die Hauptaufgabe eines Clients?", options: ["Dienste anfordern", "Dienste bereitstellen", "Netzwerke verbinden", "IP-Adressen vergeben"], answer: "Dienste anfordern", exp: "Erklärung: Im Client-Server-Modell initiiert der Client die Kommunikation und fordert gezielt Ressourcen oder Dienste (z. B. Webseiten, E-Mails) von einem Server an." },
    { type: "mc", q: "2. Welche Aussage über einen Server ist richtig?", options: ["Ein Server stellt mindestens einen Dienst bereit.", "Nur spezielle Serverhardware kann Server sein.", "Ein Server kann nie ein Client sein.", "Ein Server vergibt MAC-Adressen."], answer: "Ein Server stellt mindestens einen Dienst bereit.", exp: "Erklärung: Ein Server ist funktional durch das Bereitstellen von Diensten (Services) definiert. Auch gewöhnliche PC-Hardware kann als Server agieren." },
    { type: "mc", q: "3. Was ist ein typisches Beispiel für ein PAN (Personal Area Network)?", options: ["Verbindung Smartphone – Bluetooth-Kopfhörer", "Firmennetzwerk", "Netzwerk eines Bürogebäudes", "Verbindung zweier Standorte über Glasfaser"], answer: "Verbindung Smartphone – Bluetooth-Kopfhörer", exp: "Erklärung: Ein Personal Area Network (PAN) erstreckt sich über wenige Meter im unmittelbaren persönlichen Nahbereich, typischerweise per Bluetooth." },
    { type: "mc", q: "4. Welche Abkürzung steht für „Wide Area Network“?", options: ["WAN", "LAN", "MAN", "PAN"], answer: "WAN", exp: "Erklärung: WAN steht für Wide Area Network. Es verbindet Rechnernetze über sehr große geografische Räume (z. B. länder- oder weltweit)." },
    { type: "mc", q: "5. Welches Protokoll übersetzt Namen in IP-Adressen?", options: ["DNS", "DHCP", "HTTP", "FTP"], answer: "DNS", exp: "Erklärung: Das Domain Name System (DNS) löst menschenlesbare Rechnernamen (z. B. www.ihk.de) in die zugehörigen IP-Adressen auf." },
    { type: "mc", q: "6. Welches Protokoll vergibt IP-Konfigurationen?", options: ["DHCP", "DNS", "ARP", "ICMP"], answer: "DHCP", exp: "Erklärung: Dynamic Host Configuration Protocol (DHCP) weist Netzwerkteilnehmern automatisch IP-Adresse, Subnetzmaske, Gateway und DNS-Server zu." },
    { type: "mc", q: "7. Was ist der Hauptunterschied zwischen MAC- und IP-Adresse?", options: ["MAC ist hardwarebasiert (lokal), IP ist logisch (netzwerkweit).", "MAC ist logisch, IP ist physisch.", "MAC wird vom DHCP-Server vergeben.", "IP ist fest im BIOS gespeichert."], answer: "MAC ist hardwarebasiert (lokal), IP ist logisch (netzwerkweit).", exp: "Erklärung: Die MAC-Adresse ist die physikalische Schicht-2-Adresse der Netzwerkkarte. Die IP-Adresse ist eine logische Schicht-3-Adresse für das globale Routing." },
    { type: "mc", q: "8. Auf welcher OSI-Schicht arbeitet ein Switch hauptsächlich?", options: ["Schicht 2", "Schicht 1", "Schicht 3", "Schicht 4"], answer: "Schicht 2", exp: "Erklärung: Ein klassischer Layer-2-Switch verarbeitet Ethernet-Frames anhand der MAC-Adressen auf der Sicherungsschicht (Data Link Layer)." },
    { type: "mc", q: "9. Auf welcher OSI-Schicht arbeitet ein Router hauptsächlich?", options: ["Schicht 3", "Schicht 1", "Schicht 2", "Schicht 7"], answer: "Schicht 3", exp: "Erklärung: Router arbeiten auf der Vermittlungsschicht (Network Layer) und leiten Datenpakete logisch anhand von IP-Adressen zwischen Subnetzen weiter." },
    { type: "mc", q: "10. Wie viele Schichten besitzt das OSI-Modell?", options: ["7", "4", "5", "6"], answer: "7", exp: "Erklärung: Das ISO/IEC 7498-1 OSI-Referenzmodell ist strukturiert in exakt 7 Schichten (von Bitübertragung bis Anwendung)." },

    // 11-18
    { type: "mc", q: "11. Welche Schichten werden im TCP/IP-Modell zur Anwendungsschicht zusammengefasst?", options: ["OSI 5, 6 und 7", "OSI 1 und 2", "OSI 2 und 3", "OSI 3 und 4"], answer: "OSI 5, 6 und 7", exp: "Erklärung: Die OSI-Schichten 5 (Sitzung), 6 (Darstellung) und 7 (Anwendung) werden im vereinfachten TCP/IP-Schichtenmodell direkt als Anwendungsschicht (Application Layer) zusammengefasst." },
    { type: "mc", q: "12. Welches Protokoll gehört zur Transportschicht?", options: ["TCP", "IP", "Ethernet", "ARP"], answer: "TCP", exp: "Erklärung: Transmission Control Protocol (TCP) stellt die Ende-zu-Ende-Kommunikation auf der OSI-Transportschicht (Schicht 4) bereit." },
    { type: "mc", q: "13. Welche Aussage über TCP ist richtig?", options: ["TCP garantiert die Reihenfolge der Daten.", "TCP ist verbindungslos.", "TCP verwendet keine Bestätigungen.", "TCP ist langsamer als UDP, weil es keine Header hat."], answer: "TCP garantiert die Reihenfolge der Daten.", exp: "Erklärung: TCP ist verbindungsorientiert und nutzt Sequenznummern sowie Bestätigungen (ACKs), um Datenverlust auszuschließen und korrekte Reihenfolge zu garantieren." },
    { type: "mc", q: "14. Welche Anwendung nutzt typischerweise UDP?", options: ["Video-Streaming in Echtzeit", "Sicherer Datei-Download", "E-Mail-Versand (SMTP)", "Webzugriff (HTTP)"], answer: "Video-Streaming in Echtzeit", exp: "Erklärung: User Datagram Protocol (UDP) ist verbindungslos und hat minimale Latenzzeiten, weshalb es perfekt für zeitsensitive Daten wie Sprach- und Videostreams ist." },
    { type: "mc", q: "15. Welche Reihenfolge ist korrekt beim TCP 3-Way-Handshake?", options: ["SYN – SYN-ACK – ACK", "ACK – SYN – SYN-ACK", "SYN – SYN-ACK – ACK – ACK", "SYN-ACK – ACK – SYN"], answer: "SYN – SYN-ACK – ACK", exp: "Erklärung: Der logische Verbindungsaufbau bei TCP erfolgt streng sequenziell über Synchronize (SYN), Synchronize-Acknowledge (SYN-ACK) und Acknowledge (ACK)." },
    { type: "mc", q: "16. Welche OSI-Schicht ist für die logische Adressierung (IP) und das Routing zuständig?", img: svgOSI, options: ["Schicht 3", "Schicht 1", "Schicht 2", "Schicht 4"], answer: "Schicht 3", exp: "Erklärung: Schicht 3 (Vermittlungsschicht / Network Layer) ermöglicht die netzwerkweite Adressierung (IP) und Wegfindung (Routing)." },
    { type: "mc", q: "17. Welche Bezeichnung passt zu dem in der Abbildung gezeigten Kabel?", img: svgCable, options: ["S/FTP", "U/UTP", "F/UTP", "U/FTP"], answer: "S/FTP", exp: "Erklärung: S/FTP (Screened Foiled Twisted Pair) beschreibt ein Kabel mit Kupfergeflecht-Gesamtschirm (S) und foliengeschirmten einzelnen Adernpaaren (FTP)." },
    { type: "mc", q: "18. Welche Funktion hat die Schirmung bei Twisted-Pair-Kabeln?", options: ["Schutz vor elektromagnetischen Störungen", "Erhöhung der Kabellänge", "Erhöhung der Datenrate", "Verringerung der Anzahl der Adern"], answer: "Schutz vor elektromagnetischen Störungen", exp: "Erklärung: Die metallische Schirmung schützt die übertragenen Datensignale vor externer elektromagnetischer Einstrahlung (EMI) sowie Nahnebensprechen (Crosstalk)." },
    { type: "mc", q: "19. Welcher Stecker-Typ wird typischerweise für Glasfaserverbindungen (LWL) in modernen Switch- und Patchpanel-Umgebungen als Small-Form-Factor-Stecker verwendet?", options: ["LC-Stecker", "RJ45-Stecker", "BNC-Stecker", "D-Sub-Stecker"], answer: "LC-Stecker", exp: "Erklärung: Der LC-Stecker (Lucent Connector) ist der gängigste SFF-Glasfaserstecker in modernen Rechenzentren und Switches, da er durch seine kompakte Bauform eine hohe Portdichte erlaubt." },
    { type: "mc", q: "20. Was unterscheidet eine Singlemode-Glasfaser (OS2) grundlegend von einer Multimode-Glasfaser (OM4)?", options: ["Singlemode hat einen sehr dünnen Kern, nutzt Laser und eignet sich für sehr lange Strecken.", "Multimode nutzt Laserlicht für Strecken bis zu 40 Kilometern.", "Singlemode-Fasern sind aus Kupfer gefertigt.", "Multimode-Fasern besitzen überhaupt keinen Glaskern."], answer: "Singlemode hat einen sehr dünnen Kern, nutzt Laser und eignet sich für sehr lange Strecken.", exp: "Erklärung: Singlemode (OS2) hat einen extrem dünnen Kerndurchmesser (~9 µm), nutzt präzise Halbleiterlaser und vermeidet Modendispersion, weshalb es Reichweiten von vielen Kilometern ohne Signalverlust erreicht." },

    // 21-25
    { type: "mc", q: "21. Welche Wirkung hat die Erhöhung einer Subnetzmaske von /24 (255.255.255.0) auf /26 (255.255.255.192)?", options: ["Das Netzwerk wird in 4 kleinere Subnetze mit weniger Hosts unterteilt.", "Die Anzahl der verfügbaren Hosts pro Subnetz vervierfacht sich.", "Der Router wird nicht mehr für das Netzwerkgateway benötigt.", "Die MAC-Adressen der Clients ändern sich automatisch."], answer: "Das Netzwerk wird in 4 kleinere Subnetze mit weniger Hosts unterteilt.", exp: "Erklärung: Bei Subnetting mit /26 verbleiben 6 Bits für den Hostanteil (2^6 - 2 = 62 Hosts). Das ursprüngliche /24 Netz wird in 4 gleich große Subnetze getrennt." },
    { type: "mc", q: "22. Welche Funktion hat die Schirmung bei Twisted-Pair-Kabeln?", options: ["Schutz vor elektromagnetischen Störungen", "Erhöhung der Kabellänge", "Erhöhung der Datenrate", "Verringerung der Anzahl der Adern"], answer: "Schutz vor elektromagnetischen Störungen", exp: "Erklärung: Schirmfaktoren verringern die Signalverfälschung durch Fremdfelder." },
    { type: "mc", q: "23. Warum wird bei der Gebäudeverkabelung zwischen Primär-, Sekundär- und Tertiärbereich unterschieden?", options: ["Um strukturierte und erweiterbare Netzwerkarchitekturen zu gewährleisten.", "Weil Kupferkabel nur im Primärbereich zugelassen sind.", "Weil Router ausschließlich im Tertiärbereich eingesetzt werden.", "Um die Anzahl der benötigten IP-Adressen zu reduzieren."], answer: "Um strukturierte und erweiterbare Netzwerkarchitekturen zu gewährleisten.", exp: "Erklärung: Die Trennung in 3 Bereiche laut EN 50173 schafft eine übersichtliche, herstellerneutrale und skalierbare Verkabelungsstruktur." },
    { type: "mc", q: "24. Welche Aufgabe hat der Sekundärbereich (Gebäudebereich/Risewiring) in der strukturierten Verkabelung?", options: ["Verbindung zwischen dem Gebäudeverteiler (GV) und den Etagenverteilern (EV).", "Anbindung der einzelnen Arbeitsplatzdosen an den Etagenverteiler.", "Verbindung zwischen verschiedenen Standorten über das Internet.", "Direkte Stromversorgung der Serverräume."], answer: "Verbindung zwischen dem Gebäudeverteiler (GV) und den Etagenverteilern (EV).", exp: "Erklärung: Der Sekundärbereich verbindet vertikal innerhalb eines Gebäudes den zentralen Gebäudeverteiler mit den einzelnen Etagenverteilern (meist über Glasfaser)." },
    { type: "mc", q: "25. Wie verhält sich ein Layer-2-Switch, wenn er ein Unicast-Frame empfängt, dessen Ziel-MAC-Adresse nicht in seiner MAC-Adresstabelle eingetragen ist?", options: ["Er sendet das Frame an alle aktiven Ports außer dem Empfangsport (Flooding).", "Er verwirft das Paket sofort und sendet eine ICMP-Fehlermeldung.", "Er leitet das Frame direkt an das Standard-Gateway weiter.", "Er fordert den Client zur Neueingabe der IP-Adresse auf."], answer: "Er sendet das Frame an alle aktiven Ports außer dem Empfangsport (Flooding).", exp: "Erklärung: Ist der Ziel-Port unbekannt (Unknown Unicast), nutzt der Switch temporär Flooding an alle Ports, um den Empfänger zu finden." },

    // 26-30
    { type: "mc", q: "26. Ein PC hat keine Verbindung zum Netzwerk. Die Link-LED der Netzwerkkarte leuchtet nicht. Was prüfen Sie zuerst?", options: ["Netzwerkkabel und phys. Verbindung", "IP-Konfiguration", "DNS-Server", "Firewall-Regeln"], answer: "Netzwerkkabel und phys. Verbindung", exp: "Erklärung: Eine erloschene Link-LED bedeutet, dass auf Schicht 1 (Bitübertragungs- und Steckverbindung) kein elektrisches/optisches Trägersignal anliegt." },
    { type: "mc", q: "27. Ein Benutzer kann das Gateway pingen, aber keine Webseite aufrufen. Was ist am wahrscheinlichsten defekt?", options: ["DNS-Konfiguration", "Netzwerkkarte", "Netzteil", "RAM-Modul"], answer: "DNS-Konfiguration", exp: "Erklärung: Da der Ping auf die IP-Adresse des Gateways funktioniert, steht das Routing auf Layer 3. Es fehlt die Umsetzung der Webseiten-Namen durch DNS." },
    { type: "mc", q: "28. Nach einem Umbau funktionieren alle PCs in einem Raum außer einem. Die Kabel und Ports sind korrekt. Was ist die wahrscheinlichste Ursache?", options: ["Falsche VLAN-Konfiguration", "Falsche IP-Adresse", "Defektes Patchpanel", "VLAN-Tagging am Endgerät deaktiviert"], answer: "Falsche VLAN-Konfiguration", exp: "Erklärung: Ist der entsprechende Switch-Port im falschen VLAN eingeteilt, verbleibt der Client isoliert in einer falschen Broadcast-Domäne." },
    { type: "mc", q: "29. Ein Unternehmen überträgt eine 50 GB große Datei über eine 1 Gbit/s Verbindung. Wie lange dauert die Übertragung theoretisch? (1 Byte = 8 Bit)", options: ["ca. 6 Minuten 40 Sekunden", "ca. 5 Minuten", "ca. 11 Minuten", "ca. 50 Minuten"], answer: "ca. 6 Minuten 40 Sekunden", exp: "Erklärung: 50 GB * 8 = 400 Gbit. 400 Gbit / 1 Gbit/s = 400 Sekunden. 400 Sekunden / 60 = 6 Minuten und 40 Sekunden." },
    { type: "mc", q: "30. Ein Access Point soll per Netzwerkkabel mit Strom versorgt werden. Welches Verfahren wird eingesetzt?", options: ["PoE", "DHCP", "DNS", "ARP"], answer: "PoE", exp: "Erklärung: Power over Ethernet (PoE nach IEEE 802.3af/at/bt) führt die Versorgungsspannung direkt über die verdrillten Adern des Ethernet-Kabels zu." },

    // 31-35
    { type: "mc", q: "31. Zwischen zwei Gebäuden (300 m Entfernung) soll eine stabile, störsichere Verbindung mit 10 Gbit/s realisiert werden. Welches Medium ist am besten geeignet?", options: ["Singlemode-Glasfaser", "U/UTP-Kupferkabel", "Koaxialkabel", "Multimode-Glasfaser"], answer: "Singlemode-Glasfaser", exp: "Erklärung: Singlemode-Glasfaser bietet maximale Reichweite ohne Signaldämpfung und garantiert die notwendige galvanische Trennung zur Vermeidung von Potenzialausgleichsströmen zwischen Gebäuden." },
    { type: "mc", q: "32. Ein Switch leitet Daten an alle Ports weiter, auch wenn der Empfänger bekannt ist. Woran liegt das?", options: ["Der Switch arbeitet wie ein Hub", "Loop im Netzwerk", "Falsches VLAN", "MAC-Adresstabelle ist leer"], answer: "Der Switch arbeitet wie ein Hub", exp: "Erklärung: Wenn der Switch seine MAC-Table leert oder durch Angriffe (MAC-Flooding) überlastet ist, verhält er sich wie ein robuster Hub und flutet alle Frames." },
    { type: "mc", q: "33. Ein Client erhält keine IP-Adresse. Wo sollten Sie zuerst prüfen?", options: ["DHCP-Server ist erreichbar", "Eintrag im DNS-Server", "MAC-Adresse des Clients", "Subnetzmaske des Routers"], answer: "DHCP-Server ist erreichbar", exp: "Erklärung: Erhält ein Client keine IP-Zuweisung, schlägt die automatisierte Bereitstellung fehl. Der DHCP-Server oder die Verbindung zu ihm ist unterbrochen." },
    { type: "mc", q: "34. Ein Twisted-Pair-Kabel ist direkt parallel zu einer 230V-Stromleitung verlegt. Welche Auswirkung kann das haben?", options: ["Elektromagnetische Störungen (EMI)", "Erhöhte Bandbreite", "Kürzere Laufzeit", "Keine Auswirkung"], answer: "Elektromagnetische Störungen (EMI)", exp: "Erklärung: Wechselstromfelder induzieren Störspannungen in parallele Datenkabel, was zu massiven Paketverlusten führt." },
    { type: "mc", q: "35. Der Download einer Datei ist sehr langsam, obwohl die Leitung 1 Gbit/s hat. Viele Kollegen nutzen gleichzeitig das Netzwerk. Was ist am wahrscheinlichsten?", options: ["Überlastung der Bandbreite", "Defekte Festplatte am Client", "Falscher Kabeltyp", "Falsche MAC-Adresse"], answer: "Überlastung der Bandbreite", exp: "Erklärung: Bandbreite beschreibt das Maximum der Leitung. Teilen sich viele Clients das Netz, sinkt der tatsächlich nutzbare Durchsatz pro User enorm." },

    // 36-50
    { type: "mc", q: "36. Ein Netzwerkkabel ist 85 m lang. Ist das zulässig laut Ethernet-Standard?", options: ["Ja, bis max. 100 m zulässig", "Nein, maximal 50 m erlaubt", "Nein, maximal 75 m erlaubt", "Ja, bis maximal 500 m zulässig"], answer: "Ja, bis max. 100 m zulässig", exp: "Erklärung: Die Gesamtlänge eines Channel-Links bei Twisted-Pair-Kabeln darf laut ISO/IEC 11801 maximal 100 m betragen (90 m Verlegekabel + 10 m Patchkabel)." },
    { type: "mc", q: "37. Wie viele nutzbare Host-IP-Adressen stehen in einem IPv4 Subnetz /24 zur Verfügung?", options: ["254", "256", "255", "512"], answer: "254", exp: "Erklärung: Ein /24 Netz hat 8 Host-Bits (2^8 = 256 Adressen). Davon werden die Netz-ID (erste) und die Broadcast-Adresse (letzte) abgezogen -> 254 nutzbare Host-IPs." },
    { type: "mc", q: "38. Sie planen 3 Etagen mit je 24 Arbeitsplätzen (je 2 Ports). Wie viele Ports benötigt das Patchpanel pro Etage mindestens?", options: ["48 Ports", "24 Ports", "72 Ports", "96 Ports"], answer: "48 Ports", exp: "Erklärung: 24 Arbeitsplätze * 2 Ports = 48 Netzwerk-Dosen-Ports pro Etage." },
    { type: "mc", q: "39. Wie viele Höheneinheiten (HE) belegt ein 48-Port Patchpanel typischerweise im 19-Zoll-Schrank?", options: ["1 HE", "2 HE", "4 HE", "6 HE"], answer: "1 HE", exp: "Erklärung: Standard-Patchpanels im 19-Zoll-Format bringen 48 Ports bei kompakter Bauweise auf 1 Höheneinheit (1,75 Zoll / 44,45 mm) unter." },
    { type: "mc", q: "40. Welche Übertragungsrate bietet der Standard 10GBASE-T?", options: ["10 Gbit/s", "1 Gbit/s", "100 Mbit/s", "100 Gbit/s"], answer: "10 Gbit/s", exp: "Erklärung: Die Nomenklatur beschreibt es direkt: 10G = 10 Gigabit pro Sekunde über Baseband Twisted Pair (-T)." },
    { type: "mc", q: "41. Sie planen 3 Etagen mit 24 Arbeitsplätzen. Wie viele Patchpanels (à 24 Ports, 2 Ports/Platz) benötigen Sie insgesamt?", options: ["6", "3", "12", "24"], answer: "6", exp: "Erklärung: 3 Etagen * 48 Ports = 144 Ports gesamt. 144 Ports / 24 Ports pro Panel = 6 Patchpanels." },
    { type: "mc", q: "42. Welche Aufgabe hat ein VLAN-Trunk (Tagged Port nach IEEE 802.1Q) zwischen zwei Switches?", options: ["Er überträgt Daten mehrerer VLANs über eine gemeinsame physische Leitung.", "Er erhöht die elektrische Stromstärke für PoE-Geräte.", "Er verbindet den Switch direkt mit dem Internet-Provider.", "Er wandelt Kupfer-Signale automatisch in Glasfaser um."], answer: "Er überträgt Daten mehrerer VLANs über eine gemeinsame physische Leitung.", exp: "Erklärung: Auf einem Trunk-Port fügt der Switch jedem Frame einen 4-Byte 802.1Q Tag hinzu, um Daten verschiedener VLANs über ein einziges Kabel getrennt zu transportieren." },
    { type: "mc", q: "43. Welche Wellenlänge wird häufig bei Singlemode-Glasfasern (OS2) verwendet?", options: ["1310 nm / 1550 nm", "850 nm", "650 nm", "400 nm"], answer: "1310 nm / 1550 nm", exp: "Erklärung: Singlemode-Fasern sind für langwelliges Infrarotlicht im Dämpfungsminimum bei 1310 nm und 1550 nm optimiert." },
    { type: "mc", q: "44. Ein Kupferkabel hat einen Widerstand von ca. 8,4 Ω pro 100m. Wie hoch ist der Widerstand für 90m?", options: ["ca. 7,56 Ω", "ca. 8,4 Ω", "ca. 75,6 Ω", "ca. 9,0 Ω"], answer: "ca. 7,56 Ω", exp: "Erklärung: Dreisatz: 8,4 Ω / 100 m = 0,084 Ω/m. 0,084 Ω/m * 90 m = 7,56 Ω." },
    { type: "mc", q: "45. Welche Aussage zu VLANs ist richtig?", options: ["VLANs trennen Broadcast-Domänen logisch auf Layer 2.", "VLANs erhöhen die physikalische Bandbreite.", "VLANs ersetzen den Router vollständig.", "VLANs funktionieren nur ohne Switches."], answer: "VLANs trennen Broadcast-Domänen logisch auf Layer 2.", exp: "Erklärung: Ein Virtual LAN unterteilt ein physisches Switched-Netzwerk in mehrere unabhängige logische Broadcast-Segmente." },
    { type: "mc", q: "46. Was passiert mit einem ungetaggten Ethernet-Frame, wenn es an einem Switch-Port eintrifft, der als Access-Port für VLAN 10 konfiguriert ist?", options: ["Der Switch weist dem Frame intern das VLAN 10 zu.", "Das Frame wird sofort als fehlerhaft verworfen.", "Der Switch leitet das Paket an alle VLANs weiter.", "Das Paket wird automatisch im Router verschlüsselt."], answer: "Der Switch weist dem Frame intern das VLAN 10 zu.", exp: "Erklärung: Ein Access-Port nimmt ungetaggte Frames von Endgeräten entgegen und ordnet sie intern fest der hinterlegten VLAN-ID (z. B. VLAN 10) zu." },
    { type: "mc", q: "47. Welche Funktion hat Wake-on-LAN (WoL)?", options: ["Einschalten eines ausgeschalteten PCs per Magic Packet", "Backup über das Netzwerk", "Neustart eines Routers", "Verschlüsselung von Daten"], answer: "Einschalten eines ausgeschalteten PCs per Magic Packet", exp: "Erklärung: WoL horcht über die Standby-Stromversorgung der Netzwerkkarte auf ein 'Magic Packet' (6x FF + 12x Ziel-MAC) und startet den Hauptprozessor." },
    { type: "mc", q: "48. Welche Norm beschreibt die strukturierte Verkabelung in Europa?", options: ["EN 50173 / ISO/IEC 11801", "TIA/EIA-568", "DIN VDE 0888", "IEEE 802.3"], answer: "EN 50173 / ISO/IEC 11801", exp: "Erklärung: Die europäische Norm EN 50173 definiert herstellerneutrale Vorgaben für Anwendungs- und Standortverkabelung." },
    { type: "mc", q: "49. Wie lautet die messtechnische Größe bei Abnahme einer Glasfaserstrecke?", options: ["Dämpfungsmessung in dB", "Widerstandsmessung in Ohm", "Spannungsmessung in Volt", "Frequenzmessung in Hz"], answer: "Dämpfungsmessung in dB", exp: "Erklärung: Dämpfung (gemessen in Dezibel) beschreibt den Verlust an Lichtleistung über die Glasfaserstrecke inklusive Steckverbindungen und Spleiße." },
    { type: "mc", q: "50. Welche Adernpaare werden bei 100BASE-TX (Fast Ethernet) zur Übertragung genutzt?", options: ["Adernpaare 1-2 und 3-6", "Adernpaare 4-5 und 7-8", "Alle 4 Adernpaare", "Nur Adernpaar 1-2"], answer: "Adernpaare 1-2 und 3-6", exp: "Erklärung: Fast Ethernet mit 100 Mbit/s benötigt lediglich 2 Adernpaare (Pins 1, 2 für TX und Pins 3, 6 für RX). Erst Gigabit nutzt alle 4 Paare." },

    // NEU NEU ZUSÄTZLICHE AUFGABEN (111-126) LAUT ANFORDERUNG
    { type: "mc", q: "Aufgabe 111: Ein Unternehmen plant die Modernisierung seines Netzwerks. Der Administrator schlägt vor, alle Verbindungen zwischen den Switches eines Gebäudes von Kupfer auf Glasfaser umzustellen. Welches Argument ist fachlich am stärksten?", options: ["Glasfaser benötigt keine Netzwerkprotokolle.", "Glasfaser ist unempfindlich gegenüber elektromagnetischen Störungen.", "Glasfaser benötigt keine Switches.", "Glasfaser verwendet keine MAC-Adressen."], answer: "Glasfaser ist unempfindlich gegenüber elektromagnetischen Störungen.", exp: "Erklärung: Glasfaser überträgt optische Signale (Licht), ist somit vollständig galvanisch getrennt und unempfindlich gegen elektrische und elektromagnetische Störungen (EMI)." },

    { type: "mc", q: "Aufgabe 112: In einem Bürogebäude berichten Mitarbeiter, dass Videokonferenzen regelmäßig abbrechen. Die Analyse zeigt, dass viele Clients gleichzeitig große Dateien herunterladen. Welcher Begriff beschreibt am besten die Ursache?", options: ["MAC-Spoofing", "Geringe Bandbreite", "Zu niedriger verfügbarer Durchsatz", "Falsche AWG-Klasse"], answer: "Zu niedriger verfügbarer Durchsatz", exp: "Erklärung: Der Durchsatz ist die tatsächlich netto zur Verfügung stehende Datenrate pro Rechner. Bei hoher Auslastung sinkt der Durchsatz pro Nutzer ab, wodurch Video-Streams abbrechen." },

    { type: "mc", q: "Aufgabe 113: Ein Unternehmen möchte die Ausfallsicherheit erhöhen. Deshalb wird diskutiert, ob die Verbindung zwischen zwei zentralen Switches redundant aufgebaut werden soll. Welcher Vorteil entsteht dadurch hauptsächlich?", options: ["Geringerer Stromverbrauch", "Alternative Datenwege bei Leitungsfehlern", "Weniger MAC-Adressen", "Höhere Monitorauflösung"], answer: "Alternative Datenwege bei Leitungsfehlern", exp: "Erklärung: Redundante Wege sichern die Netzwerkkonnektivität ab. Fällt ein Kabel aus, übernimmt eine zweite Verbindung (z. B. via Spanning Tree Protocol STP)." },

    { type: "mc", q: "Aufgabe 114: Ein Techniker überprüft ein Netzwerkkabel und erkennt die Aufschrift 'AWG 24'. Ein Kollege behauptet, AWG 26 wäre dicker. Welche Aussage ist korrekt?", options: ["AWG 26 ist dicker.", "AWG 24 und AWG 26 sind gleich dick.", "AWG 24 ist dicker als AWG 26.", "AWG beschreibt die Kabellänge."], answer: "AWG 24 ist dicker als AWG 26.", exp: "Erklärung: AWG (American Wire Gauge) funktioniert umgekehrt proportional: Je kleiner die AWG-Zahl, desto dicker ist der Kupferleiter. AWG 24 hat also einen größeren Querschnitt als AWG 26." },

    { type: "mc", q: "Aufgabe 115: Ein Unternehmen möchte in Zukunft mehrere zusätzliche Arbeitsplätze auf einer Etage einrichten. Der Etagenverteiler ist bereits vorhanden. Welche Eigenschaft der strukturierten Verkabelung unterstützt diese Erweiterung am besten?", options: ["Zentrale und standardisierte Verkabelungsstruktur", "Verwendung von CSMA/CD", "Feste MAC-Adressen", "Einsatz von Halbduplex"], answer: "Zentrale und standardisierte Verkabelungsstruktur", exp: "Erklärung: Strukturierte Verkabelung nach EN 50173 zeichnet sich durch Flexibilität, Standardisierung und einfache Skalierbarkeit aus." },

    { type: "mc", q: "Aufgabe 116: Ein Mitarbeiter vergleicht WLAN und Ethernet. Er behauptet, dass bei WLAN dieselbe Kollisionsbehandlung wie bei klassischen Hub-Netzwerken verwendet wird. Wie bewertest du diese Aussage?", options: ["Richtig, WLAN verwendet CSMA/CD.", "WLAN verwendet weder CSMA/CD noch CSMA/CA.", "WLAN verwendet CSMA/CA statt CSMA/CD.", "WLAN verwendet ausschließlich TCP."], answer: "WLAN verwendet CSMA/CA statt CSMA/CD.", exp: "Erklärung: Im kabellosen Funknetz (WLAN) können Kollisionen auf dem Medium nicht direkt erkannt werden (Hidden Station Problem), weshalb CSMA/CA (Collision Avoidance = Vermeidung) eingesetzt wird." },

    { type: "mc", q: "Aufgabe 117: Bei einer Netzwerkdokumentation wird ein Switch als 'intelligente Komponente' bezeichnet. Warum ist diese Beschreibung gerechtfertigt?", options: ["Er kann Webseiten darstellen.", "Er lernt MAC-Adressen und trifft Weiterleitungsentscheidungen.", "Er vergibt IP-Adressen.", "Er verschlüsselt automatisch alle Daten."], answer: "Er lernt MAC-Adressen und trifft Weiterleitungsentscheidungen.", exp: "Erklärung: Ein Switch liest die Quell-MAC-Adressen, speichert sie in seiner CAM-Tabelle und leitet Frames zielgerichtet nur an den dazugehörigen Port weiter." },

    { type: "mc", q: "Aufgabe 118: Ein Unternehmen betreibt ein Rechenzentrum. Für eine neue Serververbindung werden 40 Gbit/s auf einer Strecke von nur 20 Metern benötigt. Welches Medium ist am sinnvollsten?", options: ["Cat 8", "Cat 5e", "Telefonleitung", "Koaxialkabel aus dem Kabelfernsehen"], answer: "Cat 8", exp: "Erklärung: Kategorie 8 (Cat 8) ist speziell für Rechenzentren für Übertragungsraten bis zu 25GBASE-T / 40GBASE-T auf kurzen Strecken bis 30 Meter ausgelegt." },

    { type: "mc", q: "Aufgabe 119: Während einer Fehlersuche stellt ein Administrator fest, dass mehrere Netzwerkgeräte dieselbe Broadcast-Nachricht empfangen haben. Welche MAC-Adresse war wahrscheinlich als Zieladresse eingetragen?", options: ["00:00:00:00:00:00", "FF:FF:FF:FF:FF:FF", "11:11:11:11:11:11", "01:23:45:67:89:AB"], answer: "FF:FF:FF:FF:FF:FF", exp: "Erklärung: Die Adresse FF:FF:FF:FF:FF:FF ist die universelle Layer-2 Broadcast-Adresse. Jedes Empfangsgerät verarbeitet dieses Frame." },

    { type: "mc", q: "Aufgabe 120: Ein Unternehmen ersetzt alte Hubs durch moderne Switches. Nach der Umstellung steigt die Netzwerkleistung deutlich. Welcher technische Grund trägt am stärksten dazu bei?", options: ["Jeder Switch-Port besitzt eine eigene Kollisionsdomäne.", "Switches besitzen längere MAC-Adressen.", "Switches verwenden andere IP-Adressen.", "Switches erhöhen automatisch die Bandbreite des Internetanschlusses."], answer: "Jeder Switch-Port besitzt eine eigene Kollisionsdomäne.", exp: "Erklärung: Während ein Hub eine einzige gemeinsame Kollisionsdomäne für alle Ports bildet, separiert ein Switch jeden Port in eine eigene Kollisionsdomäne und ermöglicht Vollduplex." },

    { type: "mc", q: "Aufgabe 122: Ein PC hat die IP-Adresse: 192.168.1.20/24. Wie lautet die Netzwerkadresse?", options: ["192.168.1.0", "192.168.1.20", "192.168.1.255", "255.255.255.0"], answer: "192.168.1.0", exp: "Erklärung: Bei /24 (Subnetzmaske 255.255.255.0) sind die ersten 3 Oktette der Netzanteil. Der Hostanteil wird für die Netzwerkadresse komplett auf 0 gesetzt -> 192.168.1.0." },

    { type: "mc", q: "Aufgabe 123: Ein PC besitzt die Adresse: 192.168.5.120/24. Wie lautet die Broadcast-Adresse?", options: ["192.168.5.0", "192.168.5.1", "192.168.5.120", "192.168.5.255"], answer: "192.168.5.255", exp: "Erklärung: Für die Broadcast-Adresse in einem /24 Netz wird der komplette Hostanteil auf 1 gesetzt (255) -> 192.168.5.255." },

    { type: "mc", q: "Aufgabe 124: Wie viele nutzbare Host-Adressen stehen in einem Netzwerk mit /24 zur Verfügung?", options: ["128", "254", "255", "256"], answer: "254", exp: "Erklärung: /24 bietet insgesamt 256 Adressen (2^8). Davon entfallen 1 Adresse für die Netz-ID und 1 für die Broadcast-Adresse. Nutzbare Hosts: 256 - 2 = 254." },

    { type: "mc", q: "Aufgabe 125: Ein Unternehmen benötigt ein kleines Netzwerk für 8 PCs und 2 Drucker (insgesamt 10 Geräte). Welches Subnetz ist ausreichend?", options: ["/30", "/29", "/28", "/24"], answer: "/28", exp: "Erklärung: Benötigt werden 10 Adressen. /30 = 2 Hosts (zu klein), /29 = 6 Hosts (zu klein), /28 = 14 nutzbare Hosts (ausreichend für 10 Geräte)." },

    { type: "mc", q: "Aufgabe 126 (Bonusfrage): Zwei PCs besitzen folgende Adressen: PC1: 192.168.10.15/24 und PC2: 192.168.10.200/24. Welche Aussage ist richtig?", options: ["Beide liegen im selben Netzwerk.", "Beide liegen in unterschiedlichen Netzwerken.", "PC2 ist die Broadcast-Adresse.", "PC1 ist die Netzwerkadresse."], answer: "Beide liegen im selben Netzwerk.", exp: "Erklärung: Beide IP-Adressen stimmen in den ersten drei Oktetten (192.168.10.x) überein und nutzen die Subnetzmaske /24. Sie befinden sich also im selben IP-Netzwerk." }
];

let currentQ = 0;
let score = 0;
let currentShuffledOptions = [];

function showQuestion() {
    const q = questions[currentQ];
    document.getElementById("progress").innerText = `Frage ${currentQ + 1} von ${questions.length}`;
    const container = document.getElementById("question-content");
    const feedback = document.getElementById("feedback-area");
    feedback.innerHTML = "";
    document.getElementById("next-btn").style.display = "none";

    let html = `<div class="question-text">${q.q}</div>`;

    if (q.img) {
        html += `<div class="q-image-container">${q.img}</div>`;
    }

    currentShuffledOptions = shuffleArray(q.options);
    html += `<div id="options-container">`;
    currentShuffledOptions.forEach((opt, idx) => {
        html += `<button class="option" onclick="checkMC(${idx})">${opt}</button>`;
    });
    html += `</div>`;

    container.innerHTML = html;
}

function checkMC(selectedIndex) {
    const q = questions[currentQ];
    const selectedOption = currentShuffledOptions[selectedIndex];
    const optionsBtns = document.querySelectorAll(".option");
    optionsBtns.forEach(btn => btn.disabled = true);

    if (selectedOption === q.answer) {
        optionsBtns[selectedIndex].classList.add("correct");
        score++;
        showFeedback(true, `Richtig!\n\n${q.exp}`);
    } else {
        optionsBtns[selectedIndex].classList.add("incorrect");
        currentShuffledOptions.forEach((opt, idx) => {
            if (opt === q.answer) {
                optionsBtns[idx].classList.add("correct");
            }
        });
        showFeedback(false, `Falsch! Richtige Antwort: ${q.answer}\n\n${q.exp}`);
    }
    document.getElementById("next-btn").style.display = "inline-block";
}

function showFeedback(isCorrect, text) {
    const feedback = document.getElementById("feedback-area");
    feedback.className = `feedback ${isCorrect ? 'feedback-correct' : 'feedback-incorrect'}`;
    
    const memeArray = isCorrect ? correctMemes : incorrectMemes;
    const randomMeme = memeArray[Math.floor(Math.random() * memeArray.length)];

    feedback.innerHTML = `
        <div style="white-space: pre-line;">${text}</div>
        <div class="feedback-img">
            <img src="${randomMeme}" alt="Reaktion Bild">
        </div>
    `;
}

function nextQuestion() {
    currentQ++;
    if (currentQ < questions.length) {
        showQuestion();
    } else {
        finishQuiz();
    }
}

function getRangliste() {
    const data = localStorage.getItem(`lf03_rangliste_v4`);
    if (data) {
        return JSON.parse(data);
    }
    return [
        { name: "Netzwerk-Profi", score: 62, max: questions.length, date: "17.09.2026" },
        { name: "SysAdmin_2026", score: 55, max: questions.length, date: "17.09.2026" }
    ];
}

function saveRanglisteEntry(name) {
    if (!name || name.trim() === "") return;
    let list = getRangliste();
    const today = new Date().toLocaleDateString('de-DE');
    list.push({
        name: name.trim(),
        score: score,
        max: questions.length,
        date: today
    });
    list.sort((a, b) => b.score - a.score);
    list = list.slice(0, 10);
    localStorage.setItem(`lf03_rangliste_v4`, JSON.stringify(list));
    renderRangliste(name.trim());
}

function renderRangliste(highlightName = null) {
    const list = getRangliste();
    let html = `
        <table class="rangliste-table">
            <tr>
                <th>Rang</th>
                <th>Name</th>
                <th>Punkte</th>
                <th>Prozent</th>
                <th>Datum</th>
            </tr>
    `;
    list.forEach((item, index) => {
        const isCurrent = highlightName && item.name === highlightName && item.score === score;
        const rowClass = isCurrent ? 'class="highlight-row"' : '';
        const pct = Math.round((item.score / item.max) * 100);
        html += `
            <tr ${rowClass}>
                <td><strong>#${index + 1}</strong></td>
                <td>${item.name}</td>
                <td>${item.score} / ${item.max}</td>
                <td>${pct}%</td>
                <td>${item.date}</td>
            </tr>
        `;
    });
    html += `</table>`;
    document.getElementById("rangliste-table-container").innerHTML = html;
}

function finishQuiz() {
    const passed = score >= (questions.length / 2);
    
    const imgSrc = passed 
        ? "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExeTg2NGxudjlweDQzaWV0a3ljdmQwaDhwbWVpM250MTRqb3dpdDRjciZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3o7qE2VAxuXWeyvJIY/giphy.webp"
        : "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdzgxbGplZnkzdnFhanE2M3d5bDIybTZiN2J1Zm1qbzk4OHppdGdudyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l1J9u3TZfpmeDLkD6/giphy.gif";

    document.getElementById("quiz-card").innerHTML = `
        <div id="score-board">
            <h2>Lernzielkontrolle LF03 Beendet!</h2>
            <p style="font-size: 1.3em;">Ergebnis: <strong>${score}</strong> von <strong>${questions.length}</strong> Punkten (${Math.round(score/questions.length*100)}%)</p>
            <div class="img-container">
                <img src="${imgSrc}" alt="Ergebnis Bild">
            </div>
            <div class="meme-text">${passed ? 'Herzlichen Glückwunsch! Du bist bestens auf die LF03 IHK-Prüfung vorbereitet! 🎉' : 'Das war leider noch nicht ausreichend. Geh die Themen noch einmal durch! 😭'}</div>
            
            <div class="rangliste-container">
                <h3>🏆 Rangliste LF03</h3>
                <div class="rangliste-form" id="rangliste-form-box">
                    <input type="text" id="player-name" placeholder="Deinen Namen eintragen..." autocomplete="off">
                    <button class="submit-btn" style="margin-top:0;" onclick="submitScore()">In Rangliste eintragen</button>
                </div>
                <div id="rangliste-table-container"></div>
            </div>
            
            <button class="submit-btn" onclick="location.reload()" style="margin-top:20px;">Test erneut starten</button>
        </div>
    `;
    
    renderRangliste();
}

function submitScore() {
    const nameInput = document.getElementById("player-name");
    if (nameInput && nameInput.value.trim() !== "") {
        saveRanglisteEntry(nameInput.value);
        document.getElementById("rangliste-form-box").style.display = "none";
    }
}

showQuestion();
</script>

</body>
</html>
