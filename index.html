            { type: "mc", q: "1. Was beschreibt Simplex-Kommunikation?", options: ["Kommunikation nur in eine Richtung", "Kommunikation gleichzeitig in beide Richtungen", "Kommunikation abwechselnd", "Vierfaches VLAN-Tagging"], answer: "Kommunikation nur in eine Richtung", exp: "Simplex erlaubt Datenfluss rein unidirektional (z.B. Radiobroadcasting)." },

            { type: "mc", q: "3. Warum wird CSMA/CD in modernen geswitchten Vollduplex-Netzen nicht benötigt?", options: ["Jeder Switch-Port bildet eine eigene Kollisionsdomäne.", "Es gibt keine MAC-Adressen mehr.", "Switches nutzen ausschließlich WLAN.", "Frames haben keine Prüfsumme."], answer: "Jeder Switch-Port bildet eine eigene Kollisionsdomäne.", exp: "Durch getrennte Sende- und Empfangsleitungen im Vollduplex entstehen keine Kollisionen." },

            { type: "mc", q: "12. Zwei Switch-Ports wurden versehentlich als Schleife verbunden. Was entsteht ohne STP?", options: ["Ein verheerender Broadcast-Sturm", "Eine DHCP-Lease", "Ein DNS-Cache", "APIPA-Modus"], answer: "Ein verheerender Broadcast-Sturm", exp: "Broadcasts kreisen endlos im Kreis und überlasten Switches und Leitungen vollständig." },

                { item: "Broadcast", target: "Kommunikation von einem Sender an alle Hosts im lokalen Netz" },
                { item: "Multicast", target: "Kommunikation an eine definierte Empfängergruppe" },
                { item: "Anycast", target: "Kommunikation an den nächstgelegenen Dienstknoten" }
            ], options: [

 "Kommunikation an den nächstgelegenen Dienstknoten"
 ], exp: "Grundlegende Kommunikationsmuster in IP-Netzwerken." },
            { type: "mc", q: "9. Welches Verfahren nutzt ein DHCP-Client ohne IP-Adresse zu Beginn seiner Suche?", options: ["Broadcast", "Unicast", "Anycast", "Nur Multicast"], answer: "Broadcast", exp: "Da der Client den Server noch nicht kennt, sendet er DHCP Discover als Broadcast." },
            { type: "mc", q: "10. Welche Aufgabe hat das Address Resolution Protocol (ARP)?", options: ["Ermittlung einer MAC-Adresse zu einer bekannten lokalen IP-Adresse", "Port-Zuordnung", "WLAN-Verschlüsselung", "TTL-Berechnung"], answer: "Ermittlung einer MAC-Adresse zu einer bekannten lokalen IP-Adresse", exp: "ARP schlägt die Brücke von Schicht 3 (IP) zu Schicht 2 (MAC)." },
            { type: "mc", q: "11. Das Ziel liegt im lokalen Netz. Wohin schickt der Client das Frame?", options: ["Direkt an die Ziel-MAC", "Immer an das Gateway", "An den DNS-Server", "An Port 80"], answer: "Direkt an die Ziel-MAC", exp: "Im lokalen Netz wird direkt ohne Router kommuniziert." },
            { type: "mc", q: "12. Was ist ein Router-Hop?", options: ["Ein passierter Router auf dem Weg zum Ziel", "Ein Ethernet-Padding", "Eine DHCP-Lease", "Ein WLAN-Key"], answer: "Ein passierter Router auf dem Weg zum Ziel", exp: "Jeder Router auf dem Pfad stellt einen Hop dar." },
            { type: "mc", q: "13. Was begrenzt die TTL (Time to Live) in einem IP-Paket?", options: ["Die maximale Anzahl erlaubter Router-Hops", "Die MAC-Tabelle", "Die PoE-Leistung", "Der DNS-Cache"], answer: "Die maximale Anzahl erlaubter Router-Hops", exp: "TTL verhindert endlose Routing-Schleifen durch Verringerung um 1 pro Router." },
            { type: "mc", q: "14. Ein Paket erreicht TTL 0 an einem Router. Was passiert?", options: ["Der Router verwirft das Paket und sendet ICMP Time Exceeded", "Der Router erhöht TTL auf 255", "Der Router vergibt APIPA", "Das Paket wird zum Broadcast"], answer: "Der Router verwirft das Paket und sendet ICMP Time Exceeded", exp: "Abgelaufene Pakete werden verworfen und dem Absender gemeldet." },
            { type: "mc", q: "15. Welchen typischen TTL-Startwert verwendet Windows standardmäßig?", options: ["128", "64", "32", "255"], answer: "128", exp: "Windows startet standardmäßig mit TTL 128." },
            { type: "mc", q: "16. Welches Protokoll nutzt der Befehl 'ping'?", options: ["ICMP", "FTP", "SMTP", "ARP"], answer: "ICMP", exp: "Ping basiert auf ICMP Echo Request/Reply." },
            { type: "match", q: "17. Sinnvolle Reihenfolge für Ping-Tests (von lokal nach extern):", pairs: [
                { item: "1. Schritt", target: "Eigene IP-Adresse / Loopback" },

                { item: "3. Schritt", target: "Externe IP-Adresse im Internet" },
                { item: "4. Schritt", target: "DNS-Name" }
            ], options: [
 "Eigene IP-Adresse / Loopback",
 "Standardgateway im lokalen Netz",
 "Externe IP-Adresse im Internet",
 "DNS-Name"
 ], exp: "Logische Fehlersuche bei Verbindungsproblemen." },
            { type: "mc", q: "18. Was prüft 'ping 127.0.0.1' (Loopback) primär?", options: ["Den funktionierenden lokalen IP-Protokollstack", "Das Gateway", "Den Internet-DNS", "Den Switchport"], answer: "Den funktionierenden lokalen IP-Protokollstack", exp: "Loopback testet die netzwerkinternen Treiber des Betriebssystems." },
            { type: "mc", q: "19. Welcher Windows-Befehl zeigt den Weg über mehrere Router?", options: ["tracert", "ipconfig", "hostname", "arp -d"], answer: "tracert", exp: "Tracert ermittelt alle Hops zum Ziel." },
            { type: "mc", q: "20. Wie macht tracert die einzelnen Hops sichtbar?", options: ["Durch schrittweise Erhöhung des TTL-Wertes", "Durch MAC-Änderung", "Durch WPA3", "Durch VLAN-Tags"], answer: "Durch schrittweise Erhöhung des TTL-Wertes", exp: "Tracert sendet Pakete mit TTL 1, 2, 3 usw., um Router-Antworten zu triggern." },
            { type: "mc", q: "21. In einer Tracert-Ausgabe erscheint bei einem Hop '* * *', aber spätere Hops antworten. Was bedeutet das?", options: ["Der betreffende Router antwortet schlicht nicht auf ICMP-Anfragen", "Die Route ist komplett zerstört", "Der Client hat keine IP", "NAT ist aus"], answer: "Der betreffende Router antwortet schlicht nicht auf ICMP-Anfragen", exp: "Manche Router verwerfen Diagnisepakete aus Sicherheitsgründen, leiten den Verkehr aber normal weiter." },
            { type: "mc", q: "22. Welcher Hop ist im lokalen Netz normalerweise der erste?", options: ["Das Standardgateway", "Der Root-DNS", "Der Zielserver", "Der DHCP-Pool"], answer: "Das Standardgateway", exp: "Das Gateway ist der erste Router-Hop für den ausgehenden Verkehr." },
            { type: "mc", q: "23. Welcher Befehl zeigt unter Windows die grundlegende IP-Konfiguration?", options: ["ipconfig", "ifconfig", "route print", "vlan show"], answer: "ipconfig", exp: "'ipconfig' zeigt IP, Subnetzmaske und Standardgateway." },
            { type: "mc", q: "24. Welcher Befehl zeigt zusätzlich MAC-Adresse, DHCP-Status und DNS-Server?", options: ["ipconfig /all", "ping /all", "tracert /dns", "hostname /full"], answer: "ipconfig /all", exp: "Mit dem Parameter /all werden alle Detailinformationen angezeigt." },
            { type: "mc", q: "25. Welcher Befehl gibt die aktuelle DHCP-Lease unter Windows frei?", options: ["ipconfig /release", "ipconfig /renew", "arp -a", "route print"], answer: "ipconfig /release", exp: "Mit /release wird die IP-Adresse freigegeben." },
            { type: "mc", q: "26. Welcher Befehl fordert eine neue DHCP-Konfiguration an?", options: ["ipconfig /renew", "ipconfig /release", "netstat -a", "hostname"], answer: "ipconfig /renew", exp: "Mit /renew wird ein neuer DHCP-Abruf gestartet." },
            { type: "match", q: "27. Zuordnung von CLI-Diagnosebefehlen:", pairs: [

                { item: "arp -a", target: "Lokale IP-MAC-Tabelle anzeigen" },
                { item: "route print", target: "Routing-Tabelle des PCs anzeigen" },
                { item: "netstat", target: "Aktive Netzwerkverbindungen und Ports anzeigen" }
            ], options: [
 "DNS-Namensauflösung prüfen",
 "Lokale IP-MAC-Tabelle anzeigen",
 "Routing-Tabelle des PCs anzeigen",
 "Aktive Netzwerkverbindungen und Ports anzeigen"
 ], exp: "Wichtige Werkzeuge für Administratoren in der Windows-Eingabeaufforderung." },
            { type: "mc", q: "28. Was beschreibt Vertraulichkeit?", options: ["Informationen bleiben nur für Berechtigte zugänglich", "Informationen bleiben jederzeit vollständig erreichbar", "Informationen werden niemals technisch verändert", "Informationen stammen immer aus echter Quelle"], answer: "Informationen bleiben nur für Berechtigte zugänglich", exp: "Vertraulichkeit schützt Informationen vor unbefugter Einsicht und Nutzung. Typische Maßnahmen sind Zugriffsrechte, starke Authentifizierung und Verschlüsselung." },
            { type: "mc", q: "29. Welches Schutzziel wird durch heimlich geänderte Noten primär verletzt?", options: ["Integrität der gespeicherten Informationen", "Verfügbarkeit des eingesetzten Systems", "Vertraulichkeit der Benutzerkonten", "Authentizität des Netzwerkgeräts"], answer: "Integrität der gespeicherten Informationen", exp: "Die Noten wurden unbefugt verändert und sind deshalb nicht mehr korrekt und unverfälscht. Genau diese Eigenschaft beschreibt die Integrität." },
            { type: "mc", q: "30. Welches Schutzziel verletzt ein DDoS-bedingter Webshop-Ausfall primär?", options: ["Verfügbarkeit des angebotenen Dienstes", "Integrität der gespeicherten Kundendaten", "Authentizität des verwendeten Servers", "Verbindlichkeit der ausgeführten Aktion"], answer: "Verfügbarkeit des angebotenen Dienstes", exp: "Bei einem DDoS-Angriff steht die Nichterreichbarkeit im Mittelpunkt. Der Webshop kann von berechtigten Kunden nicht genutzt werden, deshalb ist primär die Verfügbarkeit betroffen." },
            { type: "mc", q: "31. Welches Schutzziel betrifft ein verlorener unverschlüsselter USB-Stick mit Gehaltsdaten?", options: ["Vertraulichkeit der gespeicherten Daten", "Verfügbarkeit der zentralen Anwendung", "Integrität der Netzwerkverbindung", "Verbindlichkeit einer Transaktion"], answer: "Vertraulichkeit der gespeicherten Daten", exp: "Unbefugte könnten die sensiblen Gehaltsdaten lesen. Verschlüsselung des Datenträgers hätte die Vertraulichkeit auch bei Verlust geschützt." },
            { type: "mc", q: "32. Was bedeutet Authentizität in der Informationssicherheit?", options: ["Identität oder Herkunft ist echt und überprüfbar", "Ein Dienst steht dauerhaft ohne Ausfall bereit", "Daten können nicht unbemerkt verändert werden", "Eine Aktion wird automatisch rückgängig gemacht"], answer: "Identität oder Herkunft ist echt und überprüfbar", exp: "Authentizität beantwortet die Frage, ob eine Person, ein Gerät, ein Server oder eine Nachricht wirklich die angegebene Identität beziehungsweise Herkunft besitzt." },
            { type: "mc", q: "33. Was beschreibt Verbindlichkeit beziehungsweise Nichtabstreitbarkeit?", options: ["Handlungen sind eindeutig zuordenbar und nachweisbar", "Dienste sind bei Bedarf durchgehend verfügbar", "Informationen sind nur verschlüsselt gespeichert", "Netzwerkgeräte besitzen eindeutige MAC-Adressen"], answer: "Handlungen sind eindeutig zuordenbar und nachweisbar", exp: "Verbindlichkeit sorgt dafür, dass Nachrichten, Transaktionen oder Aktionen einer Identität zugeordnet und später beweisbar nachvollzogen werden können." },
            { type: "mc", q: "34. Welche Maßnahme unterstützt besonders die Authentizität eines Webservers?", options: ["Prüfung eines vertrauenswürdigen TLS-Zertifikats", "Speicherung täglicher Sicherungskopien", "Erweiterung des verfügbaren DHCP-Pools", "Bündelung mehrerer physischer Switchports"], answer: "Prüfung eines vertrauenswürdigen TLS-Zertifikats", exp: "Ein gültiges TLS-Zertifikat hilft dem Client zu prüfen, ob er tatsächlich mit dem erwarteten Server kommuniziert. Es unterstützt damit die Authentizität." },
            { type: "mc", q: "35. Welche Maßnahme unterstützt besonders die Verbindlichkeit?", options: ["Digitale Signatur mit nachvollziehbarem Zeitstempel", "Redundanter Server mit automatischem Failover", "Verschlüsselter Datenträger ohne Protokollierung", "Kurze DHCP-Lease für wechselnde Endgeräte"], answer: "Digitale Signatur mit nachvollziehbarem Zeitstempel", exp: "Digitale Signaturen unterstützen den Nachweis von Urheber und unverändertem Inhalt. Ein vertrauenswürdiger Zeitstempel ergänzt den Nachweis um den Zeitpunkt." },
            { type: "mc", q: "36. Was unterscheidet Safety grundsätzlich von Security?", options: ["Safety betrachtet unbeabsichtigte Fehler und Unfälle", "Safety betrachtet ausschließlich gezielte Cyberangriffe", "Safety schützt nur vertrauliche Unternehmensdaten", "Safety beschreibt ausschließlich verschlüsselte Netze"], answer: "Safety betrachtet unbeabsichtigte Fehler und Unfälle", exp: "Safety richtet sich auf sichere Funktionen und unbeabsichtigte Fehler. Security befasst sich dagegen mit absichtlichen Angriffen, Manipulation, Sabotage und Datendiebstahl." },
            { type: "mc", q: "37. Ein fehlerhaftes Update legt ein Beatmungsgerät lahm. Wie wird der Vorfall eingeordnet?", options: ["Primär als Safety-Problem durch eine Fehlfunktion", "Primär als Security-Angriff durch einen Hacker", "Primär als DNS-Problem durch Namensauflösung", "Primär als VLAN-Problem durch falsches Tagging"], answer: "Primär als Safety-Problem durch eine Fehlfunktion", exp: "Im Szenario wird kein Angreifer beschrieben. Eine unbeabsichtigte technische Fehlfunktion gefährdet die sichere Funktion des Geräts und damit einen Menschen." },
            { type: "mc", q: "38. Ein Angreifer stiehlt gezielt Patientenakten aus einem Kliniknetz. Wie wird der Vorfall eingeordnet?", options: ["Primär als Security-Vorfall durch Datendiebstahl", "Primär als Safety-Vorfall durch Materialverschleiß", "Primär als DHCP-Fehler durch einen leeren Pool", "Primär als Verkabelungsfehler durch starke Dämpfung"], answer: "Primär als Security-Vorfall durch Datendiebstahl", exp: "Der externe Akteur handelt absichtlich und nutzt eine Schwachstelle. Der gezielte Zugriff verletzt insbesondere den Schutz und die Vertraulichkeit der Patientendaten." },
            { type: "mc", q: "39. Was bedeutet TOM im Datenschutz und in der IT-Sicherheit?", options: ["Technische und organisatorische Maßnahmen", "Temporäre und operative Netzwerkmethoden", "Transportorientierte und mobile Protokolle", "Teilautomatische und optionale Mechanismen"], answer: "Technische und organisatorische Maßnahmen", exp: "TOM verbindet technische Schutzmechanismen mit Regeln, Zuständigkeiten und Prozessen. Technik allein reicht nicht, wenn organisatorische Umsetzung und Kontrolle fehlen." },
            { type: "mc", q: "40. Was ist ein Standardgateway in einem IP-Netzwerk?", options: ["Die IP-Adresse des Routers für den Weg in fremde Netze", "Ein DNS-Server", "Eine MAC-Adresse", "Ein Switchport"], answer: "Die IP-Adresse des Routers für den Weg in fremde Netze", exp: "Das Gateway ist die Router-Schnittstelle im lokalen LAN." },
            { type: "mc", q: "41. Ein Client erreicht lokale Rechner, aber kein Internet. Was prüfen Sie zuerst?", options: ["Ob das Standardgateway korrekt konfiguriert ist", "Die Gehäusefarbe des Switches", "Die Kabelmarke", "Ob der Monitor an ist"], answer: "Ob das Standardgateway korrekt konfiguriert ist", exp: "Fehlt das Gateway oder ist es falsch, ist keine Kommunikation außerhalb des LANs möglich." },
            { type: "mc", q: "42. Was ist NAT (Network Address Translation)?", options: ["Die Übersetzung von privaten IP-Adressen auf öffentliche IP-Adressen", "Ein WLAN-Verschlüsselungsstandard", "Ein DNS-Dienst", "Ein Kabeltyp"], answer: "Die Übersetzung von privaten IP-Adressen auf öffentliche IP-Adressen", exp: "NAT ermöglicht die weltweite Internetanbindung von Geräten mit privaten IP-Adressen." },
            { type: "mc", q: "43. Warum werden private IP-Adressen im Internet nicht geroutet?", options: ["Weil sie weltweit mehrfach in verschiedenen lokalen Netzen vergeben werden", "Weil sie zu lang sind", "Weil sie nur für Glasfaser gelten", "Weil Router sie blockieren müssen"], answer: "Weil sie weltweit mehrfach in verschiedenen lokalen Netzen vergeben werden", exp: "Öffentliche Router verwerfen private IPs, da diese nicht weltweit eindeutig sind." },
            { type: "mc", q: "44. Welches Protokoll löst MAC-Adressen zu bekannten IPv4-Adressen auf?", options: ["ARP", "DNS", "DHCP", "ICMP"], answer: "ARP", exp: "Das Address Resolution Protocol ermittelt die MAC zur IP im lokalen Netz." },
            { type: "mc", q: "45. Wie fragt ein Client nach einer MAC-Adresse per ARP?", options: ["Per Broadcast", "Per Unicast an den Router", "Per DNS-Abfrage", "Per DHCP-Request"], answer: "Per Broadcast", exp: "Der ARP Request wird als Broadcast an alle Hosts im LAN gesendet." },
            { type: "mc", q: "46. Wie antwortet das gesuchte Gerät auf einen ARP Request?", options: ["Per Unicast mit seiner MAC-Adresse", "Per Broadcast an alle", "Gar nicht", "Über das Gateway"], answer: "Per Unicast mit seiner MAC-Adresse", exp: "Da der Fragende bekannt ist, antwortet das Ziel direkt per Unicast." },
            { type: "mc", q: "47. Was ist der ARP-Cache?",options: ["Ein temporärer Zwischenspeicher für IP-zu-MAC-Zuordnungen im Betriebssystem", "Eine Firewall-Regel", "Ein DNS-Server", "Ein Switch-Port"], answer: "Ein temporärer Zwischenspeicher für IP-zu-MAC-Zuordnungen im Betriebssystem", exp: "Der ARP-Cache beschleunigt die Kommunikation, da MAC-Adressen nicht ständig neu erfragt werden müssen." },
            { type: "mc", q: "48. Was ist ARP-Spoofing?", options: ["Ein Angriff, bei dem ein Angreifer gefälschte ARP-Antworten sendet", "Ein DHCP-Fehler", "Eine Kabelstörung", "Ein VLAN-Tagging-Verfahren"], answer: "Ein Angriff, bei dem ein Angreifer gefälschte ARP-Antworten sendet", exp: "Beim ARP-Spoofing täuscht ein Angreifer eine falsche MAC-Adresse vor, um Datenverkehr umzuleiten (Man-in-the-Middle)." },
            { type: "mc", q: "49. Welche OSI-Schicht verarbeitet IP-Pakete und Router?", options: ["Schicht 3", "Schicht 2", "Schicht 1", "Schicht 4"], answer: "Schicht 3", exp: "IP, Routing und ICMP arbeiten auf Schicht 3." },
            { type: "mc", q: "50. Ein Client hat eine statische IP, aber Subnetzmaske und Gateway passen nicht zusammen. Was passiert?", options: ["Kommunikation ins Internet und teilweise ins LAN schlägt fehl", "Alles funktioniert perfekt", "Die MAC-Adresse ändert sich", "Der Switch wird zerstört"], answer: "Kommunikation ins Internet und teilweise ins LAN schlägt fehl", exp: "Falsche Subnetzmasken führen dazu, dass der Client das lokale Netz falsch interpretiert und das Gateway nicht erreicht." }
        ]
    },
    {

        desc: "VLAN, 802.1Q, DHCP (DORA), DNS, TCP/UDP, Ports und CLI-Diagnosebefehle (50 Fragen).",
        questions: [
            { type: "mc", q: "1. Was ist ein VLAN (Virtual Local Area Network)?", options: ["Eine logische Trennung eines physischen Switch-Netzwerks in mehrere Broadcast-Domänen", "Eine physische Glasfaser", "Ein DNS-Eintrag", "Ein PoE-Standard"], answer: "Eine logische Trennung eines physischen Switch-Netzwerks in mehrere Broadcast-Domänen", exp: "VLANs teilen Switches logisch auf, ohne dass neue Hardware nötig ist." },
            { type: "mc", q: "2. Welcher Standard definiert VLAN-Tags im Ethernet-Frame?", options: ["IEEE 802.1Q", "IEEE 802.3af", "IEEE 802.11ax", "RFC 1918"], answer: "IEEE 802.1Q", exp: "802.1Q fügt den 4-Byte VLAN-Tag hinzu." },
            { type: "mc", q: "3. Wie groß ist ein 802.1Q-VLAN-Tag?", options: ["4 Byte", "2 Byte", "6 Byte", "8 Byte"], answer: "4 Byte", exp: "Der Tag hat exakt 4 Bytes (TPID + TCI)." },
            { type: "mc", q: "4. Wie viele VLANs sind über die 12-Bit-VID praktisch nutzbar?", options: ["4094", "256", "1024", "65535"], answer: "4094", exp: "2^12 = 4096 abzüglich 0 und 4095 = 4094 nutzbare VLANs." },
            { type: "match", q: "5. Zuordnung von Switch-Port-Typen:", pairs: [

            ], options: [

 ], exp: "Access Ports bedienen Endclients, Trunk Ports leiten VLAN-übergreifende Daten weiter." },
            { type: "mc", q: "6. Was bedeutet PoE (Power over Ethernet)?", options: ["Stromversorgung von Netzwerkgeräten über das Datenkabel", "Port-Optimierung", "Verschlüsselung", "Paketüberprüfung"], answer: "Stromversorgung von Netzwerkgeräten über das Datenkabel", exp: "PoE transportiert Strom und Daten über dieselben Adern." },
            { type: "match", q: "7. Zuordnung von PoE-Standards:", pairs: [

 "Bis zu 90 W über 4 Aderpaare"
 ], exp: "Steigende Leistungsklassen im PoE-Bereich." },
            { type: "mc", q: "8. Was ist ein PSE (Power Sourcing Equipment)?", options: ["Das Gerät, das PoE-Strom bereitstellt", "Das Endgerät", "Der DNS-Server", "Der Router"], answer: "Das Gerät, das PoE-Strom bereitstellt", exp: "PSE speist ein, PD empfängt." },
            { type: "mc", q: "9. Wofür steht DHCP?", options: ["Dynamic Host Configuration Protocol", "Domain Host Control Port", "Data Handling Protocol", "Digital Hardware Control"], answer: "Dynamic Host Configuration Protocol", exp: "DHCP verteilt automatisiert IP-Konfigurationen." },
            { type: "match", q: "10. Zuordnung der DORA-Schritte:", pairs: [
                { item: "Discover", target: "Client sucht im Netz nach einem DHCP-Server" },
                { item: "Offer", target: "Server bietet dem Client eine IP-Konfiguration an" },
                { item: "Request", target: "Client fordert die angebotene IP verbindlich an" },
                { item: "Acknowledge", target: "Server bestätigt die Zuweisung endgültig" }
            ], options: [
 "Client sucht im Netz nach einem DHCP-Server",
 "Server bietet dem Client eine IP-Konfiguration an",
 "Client fordert die angebotene IP verbindlich an",
 "Server bestätigt die Zuweisung endgültig"
 ], exp: "Vierphasiger DHCP-Vergabe-Prozess." },
            { type: "mc", q: "11. Welche Parameter kann DHCP an einen Client übermitteln?", options: ["IP-Adresse, Subnetzmaske, Standardgateway und DNS-Server", "Nur die MAC-Adresse", "Nur den Port", "Nur den Hostnamen"], answer: "IP-Adresse, Subnetzmaske, Standardgateway und DNS-Server", exp: "DHCP liefert alle für die Netzwerkteilnahme notwendigen Parameter." },
            { type: "mc", q: "12. Welche UDP-Ports verwendet DHCP?", options: ["67 und 68", "20 und 21", "53 und 54", "80 und 443"], answer: "67 und 68", exp: "DHCP Server lauscht auf Port 67, Client auf Port 68." },
            { type: "mc", q: "13. Was ist eine DHCP-Lease?", options: ["Eine zeitlich befristete Ausleihe einer IP-Adresse", "Eine feste MAC-Adresse", "Ein VLAN-Trunk", "Ein WLAN-Schlüssel"], answer: "Eine zeitlich befristete Ausleihe einer IP-Adresse", exp: "IP-Adressen werden via Lease für eine bestimmte Zeit an Clients vergeben." },
            { type: "mc", q: "14. Ein Client zeigt 169.254.x.x an. Was bedeutet das?", options: ["DHCP fehlgeschlagen, APIPA-Adresse aktiv", "Öffentliche IP", "DNS läuft", "VLAN 254 aktiv"], answer: "DHCP fehlgeschlagen, APIPA-Adresse aktiv", exp: "Ohne DHCP konfiguriert sich Windows selbst eine Link-Local-IP (APIPA)." },
            { type: "mc", q: "15. Warum ist mit APIPA normalerweise kein Internetzugriff möglich?", options: ["Weil APIPA nur lokal gilt und kein gültiges Gateway liefert", "Weil APIPA TCP sperrt", "Weil die MAC gelöscht wird", "Weil Ports gesperrt sind"], answer: "Weil APIPA nur lokal gilt und kein gültiges Gateway liefert", exp: "APIPA-Adressen werden von Routern nicht geroutet." },
            { type: "mc", q: "16. Wofür steht DNS?", options: ["Domain Name System", "Dynamic Network Switch", "Data Naming Service", "Digital Node Security"], answer: "Domain Name System", exp: "DNS löst Namen in IP-Adressen auf." },
            { type: "mc", q: "17. Was ist ein FQDN (Fully Qualified Domain Name)?", options: ["Der vollständige Name eines Hosts in der DNS-Hierarchie", "Nur der PC-Name", "Eine MAC-Adresse", "Ein Port"], answer: "Der vollständige Name eines Hosts in der DNS-Hierarchie", exp: "Beispiel: `client01.abteilung.firma.de` ist ein FQDN." },

            { type: "mc", q: "37. Welche Verbesserung bietet WPA3-Personal gegenüber WPA2-Personal?", options: ["SAE erschwert aufgezeichnete Offline-Angriffe", "WEP ersetzt die bisherige AES-Verschlüsselung", "DHCP wird direkt in den Access Point integriert", "VLAN-Tags werden grundsätzlich nicht mehr benötigt"], answer: "SAE erschwert aufgezeichnete Offline-Angriffe", exp: "WPA3-Personal verwendet SAE statt des klassischen PSK-Verfahrens. Dadurch lässt sich ein aufgezeichneter Handshake nicht wie bei schwachen WPA2-Passwörtern einfach offline testen." },

            { type: "mc", q: "42. Was ist ein Exploit?", options: ["Ein konkretes Mittel zur Ausnutzung einer Schwachstelle", "Ein Wert, der von einem Unternehmen geschützt wird", "Eine allgemeine Gefahr ohne konkretes Vorgehen", "Eine Bewertung aus Eintrittswahrscheinlichkeit und Schaden"], answer: "Ein konkretes Mittel zur Ausnutzung einer Schwachstelle", exp: "Ein Exploit ist beispielsweise Schadcode, ein Skript oder eine konkrete Vorgehensweise, die eine vorhandene Schwachstelle tatsächlich ausnutzt." },
            { type: "mc", q: "43. Was beschreibt ein Risiko?", options: ["Eintrittswahrscheinlichkeit zusammen mit möglichem Schaden", "Nur das eingesetzte Werkzeug eines Angreifers", "Nur die vorhandene Schwachstelle eines Systems", "Nur den materiellen Wert eines Netzwerkgeräts"], answer: "Eintrittswahrscheinlichkeit zusammen mit möglichem Schaden", exp: "Ein Risiko besteht nicht nur aus dem Schaden. Es berücksichtigt zusätzlich, wie wahrscheinlich das schädigende Ereignis unter den gegebenen Bedingungen eintritt." },

            { type: "mc", q: "45. Welche Maßnahme unterstützt die Integrität medizinischer Befunde?", options: ["Manipulationsgeschützte Protokollierung jeder Änderung", "Kurze Lease-Zeiten für alle medizinischen Server", "Ein unverwalteter Switch ohne Überwachungsfunktion", "Gemeinsame Benutzerkonten für alle Beschäftigten"], answer: "Manipulationsgeschützte Protokollierung jeder Änderung", exp: "Audit-Logs erfassen Benutzerkonto, Zeitpunkt und Änderung. Zusammen mit Rollenrechten und regelmäßiger Kontrolle werden unberechtigte Veränderungen erkennbar." },

            { type: "mc", q: "50. Was kennzeichnet eine fachgerechte Client-Integration?", options: ["Verbindung, gültige Konfiguration, Tests und Dokumentation", "Nur ein eingestecktes Kabel ohne Funktionskontrolle", "Nur eine statische IP ohne Subnetzmaske und Gateway", "Nur ein erfolgreicher Ping auf die Loopback-Adresse"], answer: "Verbindung, gültige Konfiguration, Tests und Dokumentation", exp: "Eine vollständige Integration umfasst die physische Anbindung, passende IP-Parameter, erfolgreiche Tests von Gateway, DNS und Diensten sowie eine nachvollziehbare Dokumentation." }

let currentTabelle = null;
let currentQ = 0;
let score = 0;
let userAnswers = {};

function showMenu() {
    const card = document.getElementById("quiz-card");
    let html = `
        <h1>LERNZIELKONTROLLE LF03</h1>
        <div class="subtitle">Wähle eine der 4 Tabellen (je 50 Fragen) aus!</div>
        <div class="menu-grid">
    `;
    tabellen.forEach(t => {
        html += `
            <button class="menu-btn" onclick="startQuiz(${t.id})">
                <strong>${t.title}</strong>
                <span>${t.desc}</span>
            </button>
        `;
    });
    html += `</div>`;
    card.innerHTML = html;
}

function startQuiz(id) {
    currentTabelle = tabellen.find(t => t.id === id);
    currentQ = 0;
    score = 0;
    userAnswers = {};
    showQuestion();
}

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function showQuestion() {
    const qList = currentTabelle.questions;
    const q = qList[currentQ];
    
    const card = document.getElementById("quiz-card");
    card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <button class="back-btn" onclick="showMenu()" style="margin:0;">⬅ Tabellen-Auswahl</button>
            <div id="progress" class="progress" style="margin:0;">Frage ${currentQ + 1} von ${qList.length}</div>
        </div>
        <h1>${currentTabelle.title}</h1>
        <div class="question-text" style="margin-top:15px;">${q.q}</div>
        <div id="question-body"></div>
        <div id="feedback-area"></div>
        <div style="display:flex; justify-content:space-between; margin-top:20px;">
            <button class="prev-btn" id="prev-btn" onclick="prevQuestion()" ${currentQ === 0 ? 'style="display:none;"' : ''}>⬅ Vorherige Frage</button>
            <button id="next-btn" onclick="nextQuestion()">Nächste Frage ➡</button>
        </div>
    `;

    const bodyContainer = document.getElementById("question-body");

    if (q.type === "match") {
        let matchHtml = `<div class="matching-container">`;
        q.pairs.forEach((pair, idx) => {
            let shuffledOpts = userAnswers[currentQ]?.shuffledOpts || shuffleArray(q.options);
            if (!userAnswers[currentQ]) {
                if (!userAnswers.shuffledMap) userAnswers.shuffledMap = {};
                userAnswers[currentQ] = { shuffledOpts: shuffledOpts, selected: {} };
            }
            matchHtml += `
                <div class="matching-row">
                    <span><strong>${pair.item}</strong></span>
                    <select id="match-select-${idx}" onchange="selectMatch(${idx})">
                        <option value="">-- Bitte wählen --</option>
            `;
            shuffledOpts.forEach(opt => {
                let sel = userAnswers[currentQ].selected[idx] === opt ? 'selected' : '';
                matchHtml += `<option value="${opt}" ${sel}>${opt}</option>`;
            });
            matchHtml += `</select></div>`;
        });
        matchHtml += `</div><button class="submit-btn" onclick="checkMatch()">Antworten prüfen</button>`;
        bodyContainer.innerHTML = matchHtml;

        if (userAnswers[currentQ]?.answered) {
            document.querySelectorAll(".matching-row select").forEach(select => {
                select.disabled = true;
            });
            const submitButton = document.querySelector(".matching-container + .submit-btn");
            if (submitButton) submitButton.style.display = "none";
            showFeedback(
                userAnswers[currentQ].isCorrect,
                userAnswers[currentQ].feedbackText
            );
            document.getElementById("next-btn").style.display = "inline-block";
        }
    } else {
        let shuffledOpts = userAnswers[currentQ]?.shuffledOpts || shuffleArray(q.options);
        if (!userAnswers[currentQ]) {
            userAnswers[currentQ] = { shuffledOpts: shuffledOpts, answered: false };
        }
        let html = `<div id="options-container">`;
        shuffledOpts.forEach((opt, idx) => {
            let extraClass = "";
            let disabled = userAnswers[currentQ].answered ? 'disabled' : '';
            if (userAnswers[currentQ].answered) {
                if (opt === q.answer) extraClass = " correct";
                else if (userAnswers[currentQ].selectedIndex === idx) extraClass = " incorrect";
            }
            html += `<button class="option${extraClass}" ${disabled} onclick="checkMC(${idx})">${opt}</button>`;
        });
        html += `</div>`;
        bodyContainer.innerHTML = html;

        if (userAnswers[currentQ].answered) {
            showFeedback(userAnswers[currentQ].isCorrect, userAnswers[currentQ].feedbackText);
            document.getElementById("next-btn").style.display = "inline-block";
        }
    }
}

function checkMC(selectedIndex) {
    if (userAnswers[currentQ].answered) return;
    const qList = currentTabelle.questions;
    const q = qList[currentQ];
    const selectedOption = userAnswers[currentQ].shuffledOpts[selectedIndex];
    const optionsBtns = document.querySelectorAll(".option");
    
    userAnswers[currentQ].answered = true;
    userAnswers[currentQ].selectedIndex = selectedIndex;

    optionsBtns.forEach(btn => btn.disabled = true);

    let isCorrect = (selectedOption === q.answer);
    userAnswers[currentQ].isCorrect = isCorrect;

    if (isCorrect) {
        optionsBtns[selectedIndex].classList.add("correct");
        score++;
        userAnswers[currentQ].feedbackText = `Richtig!\n\n${q.exp}`;
    } else {
        optionsBtns[selectedIndex].classList.add("incorrect");
        userAnswers[currentQ].shuffledOpts.forEach((opt, idx) => {
            if (opt === q.answer) {
                optionsBtns[idx].classList.add("correct");
            }
        });
        userAnswers[currentQ].feedbackText = `Falsch! Richtige Antwort: ${q.answer}\n\n${q.exp}`;
    }
    showFeedback(isCorrect, userAnswers[currentQ].feedbackText);
    document.getElementById("next-btn").style.display = "inline-block";
}

function selectMatch(idx) {
    const sel = document.getElementById(`match-select-${idx}`);
    userAnswers[currentQ].selected[idx] = sel.value;
}

function checkMatch() {
    if (userAnswers[currentQ].answered) return;
    const qList = currentTabelle.questions;
    const q = qList[currentQ];
    
    let allCorrect = true;
    q.pairs.forEach((pair, idx) => {
        if (userAnswers[currentQ].selected[idx] !== pair.target) {
            allCorrect = false;
        }
    });

    userAnswers[currentQ].answered = true;
    userAnswers[currentQ].isCorrect = allCorrect;

    if (allCorrect) {
        score++;
        userAnswers[currentQ].feedbackText = `Perfekt! Alle Zuordnungen sind korrekt.\n\n${q.exp}`;
    } else {
        let correctText = q.pairs.map(p => `• ${p.item} ➔ ${p.target}`).join("\n");
        userAnswers[currentQ].feedbackText = `Nicht ganz richtig. Die korrekte Zuordnung lautet:\n${correctText}\n\n${q.exp}`;
    }

    document.querySelectorAll(".matching-row select").forEach(select => {
        select.disabled = true;
    });
    const submitButton = document.querySelector(".matching-container + .submit-btn");
    if (submitButton) submitButton.style.display = "none";
    showFeedback(allCorrect, userAnswers[currentQ].feedbackText);
    document.getElementById("next-btn").style.display = "inline-block";
}

function showFeedback(isCorrect, text) {
    const feedback = document.getElementById("feedback-area");
    feedback.className = `feedback ${isCorrect ? 'feedback-correct' : 'feedback-incorrect'}`;
    
    const memeArray = isCorrect ? correctMemes : incorrectMemes;
    const randomMeme = memeArray[Math.floor(Math.random() * memeArray.length)] || "";

    feedback.innerHTML = `
        <div style="white-space: pre-line;">${text}</div>
        <div class="feedback-img">
            <img src="${randomMeme}" alt="Feedback GIF">
        </div>
    `;
}

function prevQuestion() {
    if (currentQ > 0) {
        currentQ--;
        showQuestion();
    }
}

function nextQuestion() {
    currentQ++;
    if (currentQ < currentTabelle.questions.length) {
        showQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {
    const qList = currentTabelle.questions;
    const passed = score >= (qList.length / 2);
    const imgSrc = passed ? correctMemes[0] : incorrectMemes[0];

    const card = document.getElementById("quiz-card");
    card.innerHTML = `
        <div id="score-board">
            <h2>Auswertung: ${currentTabelle.title}</h2>
            <p style="font-size: 1.3em;">Ergebnis: <strong>${score}</strong> von <strong>${qList.length}</strong> Punkten (${Math.round(score/qList.length*100)}%)</p>
            <div class="img-container">
                <img src="${imgSrc}" alt="Auswertungs-Bild">
            </div>
            <div class="meme-text">${passed ? 'Starke Leistung! Du hast diesen Bereich bestens gemeistert! 🎉' : 'Da gibt es noch Lücken. Schau dir die Erklärungen noch einmal an! 💪'}</div>
            
            <button class="submit-btn" onclick="startQuiz(${currentTabelle.id})" style="margin-top:15px;">Diese Tabelle wiederholen</button>
            <button class="back-btn" onclick="showMenu()" style="margin-top:15px;">Zur Tabellen-Auswahl</button>
        </div>
    `;
}

showMenu();
</script>

</body>
</html>
