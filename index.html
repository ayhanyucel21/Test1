<script>
function levenshtein(a, b) {
    var matrix = [];
    var i, j;
    if (a.length === 0) return b.length;
    if (b.length === 0) return a.length;
    for (i = 0; i <= b.length; i++) { matrix[i] = [i]; }
    for (j = 0; j <= a.length; j++) { matrix[0][j] = j; }
    for (i = 1; i <= b.length; i++) {
        for (j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j - 1] + 1,
                    Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                );
            }
        }
    }
    return matrix[b.length][a.length];
}

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

    { type: "mc", q: "21. Welche Wirkung hat die Erhöhung einer Subnetzmaske von /24 (255.255.255.0) auf /26 (255.255.255.192)?", options: ["Das Netzwerk wird in 4 kleinere Subnetze mit weniger Hosts unterteilt.", "Die Anzahl der verfügbaren Hosts pro Subnetz vervierfacht sich.", "Der Router wird nicht mehr für das Netzwerkgateway benötigt.", "Die MAC-Adressen der Clients ändern sich automatisch."], answer: "Das Netzwerk wird in 4 kleinere Subnetze mit weniger Hosts unterteilt.", exp: "Erklärung: Bei Subnetting mit /26 verbleiben 6 Bits für den Hostanteil (2^6 - 2 = 62 Hosts). Das ursprüngliche /24 Netz wird in 4 gleich große Subnetze getrennt." },
    { type: "mc", q: "22. Welche Funktion hat die Schirmung bei Twisted-Pair-Kabeln?", options: ["Schutz vor elektromagnetischen Störungen", "Erhöhung der Kabellänge", "Erhöhung der Datenrate", "Verringerung der Anzahl der Adern"], answer: "Schutz vor elektromagnetischen Störungen", exp: "Erklärung: Schirmfaktoren verringern die Signalverfälschung durch Fremdfelder." },
    { type: "mc", q: "23. Warum wird bei der Gebäudeverkabelung zwischen Primär-, Sekundär- und Tertiärbereich unterschieder?", options: ["Um strukturierte und erweiterbare Netzwerkarchitekturen zu gewährleisten.", "Weil Kupferkabel nur im Primärbereich zugelassen sind.", "Weil Router ausschließlich im Tertiärbereich eingesetzt werden.", "Um die Anzahl der benötigten IP-Adressen zu reduzieren."], answer: "Um strukturierte und erweiterbare Netzwerkarchitekturen zu gewährleisten.", exp: "Erklärung: Die Trennung in 3 Bereiche laut EN 50173 schafft eine übersichtliche, herstellerneutrale und skalierbare Verkabelungsstruktur." },
    { type: "mc", q: "24. Welche Aufgabe hat der Sekundärbereich (Gebäudebereich/Risewiring) in der strukturierten Verkabelung?", options: ["Verbindung zwischen dem Gebäudeverteiler (GV) und den Etagenverteilern (EV).", "Anbindung der einzelnen Arbeitsplatzdosen an den Etagenverteiler.", "Verbindung zwischen verschiedenen Standorten über das Internet.", "Direkte Stromversorgung der Serverräume."], answer: "Verbindung zwischen dem Gebäudeverteiler (GV) und den Etagenverteilern (EV).", exp: "Erklärung: Der Sekundärbereich verbindet vertikal innerhalb eines Gebäudes den zentralen Gebäudeverteiler mit den einzelnen Etagenverteilern (meist über Glasfaser)." },

    // 25
    { type: "mc", q: "25. Wie verhält sich ein Layer-2-Switch, wenn er ein Unicast-Frame empfängt, dessen Ziel-MAC-Adresse nicht in seiner MAC-Adresstabelle eingetragen ist?", options: ["Er sendet das Frame an alle aktiven Ports außer dem Empfangsport (Flooding).", "Er verwirft das Paket sofort und sendet eine ICMP-Fehlermeldung.", "Er leitet das Frame direkt an das Standard-Gateway weiter.", "Er fordert den Client zur Neueingabe der IP-Adresse auf."], answer: "Er sendet das Frame an alle aktiven Ports außer dem Empfangsport (Flooding).", exp: "Erklärung: Ist der Ziel-Port unbekannt (Unknown Unicast), nutzt der Switch temporär Flooding an alle Ports, um den Empfänger zu finden." },

    // 26-29
    { type: "mc", q: "26. Ein PC hat keine Verbindung zum Netzwerk. Die Link-LED der Netzwerkkarte leuchtet nicht. Was prüfen Sie zuerst?", options: ["Netzwerkkabel und phys. Verbindung", "IP-Konfiguration", "DNS-Server", "Firewall-Regeln"], answer: "Netzwerkkabel und phys. Verbindung", exp: "Erklärung: Eine erloschene Link-LED bedeutet, dass auf Schicht 1 (Bitübertragungs- und Steckverbindung) kein elektrisches/optisches Trägersignal anliegt." },
    { type: "mc", q: "27. Ein Benutzer kann das Gateway pingen, aber keine Webseite aufrufen. Was ist am wahrscheinlichsten defekt?", options: ["DNS-Konfiguration", "Netzwerkkarte", "Netzteil", "RAM-Modul"], answer: "DNS-Konfiguration", exp: "Erklärung: Da der Ping auf die IP-Adresse des Gateways funktioniert, steht das Routing auf Layer 3. Es fehlt die Umsetzung der Webseiten-Namen durch DNS." },
    { type: "mc", q: "28. Nach einem Umbau funktionieren alle PCs in einem Raum außer einem. Die Kabel und Ports sind korrekt. Was ist die wahrscheinlichste Ursache?", options: ["Falsche VLAN-Konfiguration", "Falsche IP-Adresse", "Defektes Patchpanel", "VLAN-Tagging am Endgerät deaktiviert"], answer: "Falsche VLAN-Konfiguration", exp: "Erklärung: Ist der entsprechende Switch-Port im falschen VLAN eingeteilt, verbleibt der Client isoliert in einer falschen Broadcast-Domäne." },
    { type: "mc", q: "29. Ein Unternehmen überträgt eine 50 GB große Datei über eine 1 Gbit/s Verbindung. Wie lange dauert die Übertragung theoretisch? (1 Byte = 8 Bit)", options: ["ca. 6 Minuten 40 Sekunden", "ca. 5 Minuten", "ca. 11 Minuten", "ca. 50 Minuten"], answer: "ca. 6 Minuten 40 Sekunden", exp: "Erklärung: 50 GB * 8 = 400 Gbit. 400 Gbit / 1 Gbit/s = 400 Sekunden. 400 Sekunden / 60 = 6 Minuten und 40 Sekunden." },

    // 30
    { type: "mc", q: "30. Ein Access Point soll per Netzwerkkabel mit Strom versorgt werden. Welches Verfahren wird eingesetzt?", options: ["PoE", "DHCP", "DNS", "ARP"], answer: "PoE", exp: "Erklärung: Power over Ethernet (PoE nach IEEE 802.3af/at/bt) führt die Versorgungsspannung direkt über die verdrillten Adern des Ethernet-Kabels zu." },

    // 31-34
    { type: "mc", q: "31. Zwischen zwei Gebäuden (300 m Entfernung) soll eine stabile, störsichere Verbindung mit 10 Gbit/s realisiert werden. Welches Medium ist am besten geeignet?", options: ["Singlemode-Glasfaser", "U/UTP-Kupferkabel", "Koaxialkabel", "Multimode-Glasfaser"], answer: "Singlemode-Glasfaser", exp: "Erklärung: Singlemode-Glasfaser bietet maximale Reichweite ohne Signaldämpfung und garantiert die notwendige galvanische Trennung zur Vermeidung von Potenzialausgleichsströmen zwischen Gebäuden." },
    { type: "mc", q: "32. Ein Switch leitet Daten an alle Ports weiter, auch wenn der Empfänger bekannt ist. Woran liegt das?", options: ["Der Switch arbeitet wie ein Hub", "Loop im Netzwerk", "Falsches VLAN", "MAC-Adresstabelle ist leer"], answer: "Der Switch arbeitet wie ein Hub", exp: "Erklärung: Wenn der Switch seine MAC-Table leert oder durch Angriffe (MAC-Flooding) überlastet ist, verhält er sich wie ein robuster Hub und flutet alle Frames." },
    { type: "mc", q: "33. Ein Client erhält keine IP-Adresse. Wo sollten Sie zuerst prüfen?", options: ["DHCP-Server ist erreichbar", "Eintrag im DNS-Server", "MAC-Adresse des Clients", "Subnetzmaske des Routers"], answer: "DHCP-Server ist erreichbar", exp: "Erklärung: Erhält ein Client keine IP-Zuweisung, schlägt die automatisierte Bereitstellung fehl. Der DHCP-Server oder die Verbindung zu ihm ist unterbrochen." },
    { type: "mc", q: "34. Ein Twisted-Pair-Kabel ist direkt parallel zu einer 230V-Stromleitung verlegt. Welche Auswirkung kann das haben?", options: ["Elektromagnetische Störungen (EMI)", "Erhöhte Bandbreite", "Kürzere Laufzeit", "Keine Auswirkung"], answer: "Elektromagnetische Störungen (EMI)", exp: "Erklärung: Wechselstromfelder induzieren Störspannungen in parallele Datenkabel, was zu massiven Paketverlusten führt." },

    // 35
    { type: "mc", q: "35. Der Download einer Datei ist sehr langsam, obwohl die Leitung 1 Gbit/s hat. Viele Kollegen nutzen gleichzeitig das Netzwerk. Was ist am wahrscheinlichsten?", options: ["Überlastung der Bandbreite", "Defekte Festplatte am Client", "Falscher Kabeltyp", "Falsche MAC-Adresse"], answer: "Überlastung der Bandbreite", exp: "Erklärung: Bandbreite beschreibt das Maximum der Leitung. Teilen sich viele Clients das Netz, sinkt der tatsächlich nutzbare Durchsatz pro User enorm." },

    // 36-41
    { type: "mc", q: "36. Ein Netzwerkkabel ist 85 m lang. Ist das zulässig laut Ethernet-Standard?", options: ["Ja, bis max. 100 m zulässig", "Nein, maximal 50 m erlaubt", "Nein, maximal 75 m erlaubt", "Ja, bis maximal 500 m zulässig"], answer: "Ja, bis max. 100 m zulässig", exp: "Erklärung: Die Gesamtlänge eines Channel-Links bei Twisted-Pair-Kabeln darf laut ISO/IEC 11801 maximal 100 m betragen (90 m Verlegekabel + 10 m Patchkabel)." },
    { type: "mc", q: "37. Wie viele nutzbare Host-IP-Adressen stehen in einem IPv4 Subnetz /24 zur Verfügung?", options: ["254", "256", "255", "512"], answer: "254", exp: "Erklärung: Ein /24 Netz hat 8 Host-Bits (2^8 = 256 Adressen). Davon werden die Netz-ID (erste) und die Broadcast-Adresse (letzte) abgezogen -> 254 nutzbare Host-IPs." },
    { type: "mc", q: "38. Sie planen 3 Etagen mit je 24 Arbeitsplätzen (je 2 Ports). Wie viele Ports benötigt das Patchpanel pro Etage mindestens?", options: ["48 Ports", "24 Ports", "72 Ports", "96 Ports"], answer: "48 Ports", exp: "Erklärung: 24 Arbeitsplätze * 2 Ports = 48 Netzwerk-Dosen-Ports pro Etage." },
    { type: "mc", q: "39. Wie viele Höheneinheiten (HE) belegt ein 48-Port Patchpanel typischerweise im 19-Zoll-Schrank?", options: ["1 HE", "2 HE", "4 HE", "6 HE"], answer: "1 HE", exp: "Erklärung: Standard-Patchpanels im 19-Zoll-Format bringen 48 Ports bei kompakter Bauweise auf 1 Höheneinheit (1,75 Zoll / 44,45 mm) unter." },
    { type: "mc", q: "40. Welche Übertragungsrate bietet der Standard 10GBASE-T?", options: ["10 Gbit/s", "1 Gbit/s", "100 Mbit/s", "100 Gbit/s"], answer: "10 Gbit/s", exp: "Erklärung: Die Nomenklatur beschreibt es direkt: 10G = 10 Gigabit pro Sekunde über Baseband Twisted Pair (-T)." },
    { type: "mc", q: "41. Sie planen 3 Etagen mit 24 Arbeitsplätzen. Wie viele Patchpanels (à 24 Ports, 2 Ports/Platz) benötigen Sie insgesamt?", options: ["6", "3", "12", "24"], answer: "6", exp: "Erklärung: 3 Etagen * 48 Ports = 144 Ports gesamt. 144 Ports / 24 Ports pro Panel = 6 Patchpanels." },

    // 42-45
    { type: "mc", q: "42. Welche Aufgabe hat ein VLAN-Trunk (Tagged Port nach IEEE 802.1Q) zwischen zwei Switches?", options: ["Er überträgt Daten mehrerer VLANs über eine gemeinsame physische Leitung.", "Er erhöht die elektrische Stromstärke für PoE-Geräte.", "Er verbindet den Switch direkt mit dem Internet-Provider.", "Er wandelt Kupfer-Signale automatisch in Glasfaser um."], answer: "Er überträgt Daten mehrerer VLANs über eine gemeinsame physische Leitung.", exp: "Erklärung: Auf einem Trunk-Port fügt der Switch jedem Frame einen 4-Byte 802.1Q Tag hinzu, um Daten verschiedener VLANs über ein einziges Kabel getrennt zu transportieren." },
    { type: "mc", q: "43. Welche Wellenlänge wird häufig bei Singlemode-Glasfasern (OS2) verwendet?", options: ["1310 nm / 1550 nm", "850 nm", "650 nm", "400 nm"], answer: "1310 nm / 1550 nm", exp: "Erklärung: Singlemode-Fasern sind für langwelliges Infrarotlicht im Dämpfungsminimum bei 1310 nm und 1550 nm optimiert." },
    { type: "mc", q: "44. Ein Kupferkabel hat einen Widerstand von ca. 8,4 Ω pro 100m. Wie hoch ist der Widerstand für 90m?", options: ["ca. 7,56 Ω", "ca. 8,4 Ω", "ca. 75,6 Ω", "ca. 9,0 Ω"], answer: "ca. 7,56 Ω", exp: "Erklärung: Dreisatz: 8,4 Ω / 100 m = 0,084 Ω/m. 0,084 Ω/m * 90 m = 7,56 Ω." },
    { type: "mc", q: "45. Welche Aussage zu VLANs ist richtig?", options: ["VLANs trennen Broadcast-Domänen logisch auf Layer 2.", "VLANs erhöhen die physikalische Bandbreite.", "VLANs ersetzen den Router vollständig.", "VLANs funktionieren nur ohne Switches."], answer: "VLANs trennen Broadcast-Domänen logisch auf Layer 2.", exp: "Erklärung: Ein Virtual LAN unterteilt ein physisches Switched-Netzwerk in mehrere unabhängige logische Broadcast-Segmente." },

    // 46-50
    { type: "mc", q: "46. Was passiert mit einem ungetaggten Ethernet-Frame, wenn es an einem Switch-Port eintrifft, der als Access-Port für VLAN 10 konfiguriert ist?", options: ["Der Switch weist dem Frame intern das VLAN 10 zu.", "Das Frame wird sofort als fehlerhaft verworfen.", "Der Switch leitet das Paket an alle VLANs weiter.", "Das Paket wird automatisch im Router verschlüsselt."], answer: "Der Switch weist dem Frame intern das VLAN 10 zu.", exp: "Erklärung: Ein Access-Port nimmt ungetaggte Frames von Endgeräten entgegen und ordnet sie intern fest der hinterlegten VLAN-ID (z. B. VLAN 10) zu." },
    { type: "mc", q: "47. Welche Funktion hat Wake-on-LAN (WoL)?", options: ["Einschalten eines ausgeschalteten PCs per Magic Packet", "Backup über das Netzwerk", "Neustart eines Routers", "Verschlüsselung von Daten"], answer: "Einschalten eines ausgeschalteten PCs per Magic Packet", exp: "Erklärung: WoL horcht über die Standby-Stromversorgung der Netzwerkkarte auf ein 'Magic Packet' (6x FF + 12x Ziel-MAC) und startet den Hauptprozessor." },
    { type: "mc", q: "48. Welche Norm beschreibt die strukturierte Verkabelung in Europa?", options: ["EN 50173 / ISO/IEC 11801", "TIA/EIA-568", "DIN VDE 0888", "IEEE 802.3"], answer: "EN 50173 / ISO/IEC 11801", exp: "Erklärung: Die europäische Norm EN 50173 definiert herstellerneutrale Vorgaben für Anwendungs- und Standortverkabelung." },
    { type: "mc", q: "49. Wie lautet die messtechnische Größe bei Abnahme einer Glasfaserstrecke?", options: ["Dämpfungsmessung in dB", "Widerstandsmessung in Ohm", "Spannungsmessung in Volt", "Frequenzmessung in Hz"], answer: "Dämpfungsmessung in dB", exp: "Erklärung: Dämpfung (gemessen in Dezibel) beschreibt den Verlust an Lichtleistung über die Glasfaserstrecke inklusive Steckverbindungen und Spleiße." },
    { type: "mc", q: "50. Welche Adernpaare werden bei 100BASE-TX (Fast Ethernet) zur Übertragung genutzt?", options: ["Adernpaare 1-2 und 3-6", "Adernpaare 4-5 und 7-8", "Alle 4 Adernpaare", "Nur Adernpaar 1-2"], answer: "Adernpaare 1-2 und 3-6", exp: "Erklärung: Fast Ethernet mit 100 Mbit/s benötigt lediglich 2 Adernpaare (Pins 1, 2 für TX und Pins 3, 6 für RX). Erst Gigabit nutzt alle 4 Paare." },

    // 51-80
    { type: "mc", q: " 51: Welche Aussage beschreibt den Unterschied zwischen Bandbreite und Durchsatz am besten?", options: ["Beide Begriffe haben dieselbe Bedeutung.", "Bandbreite ist die theoretische Kapazität, Durchsatz die tatsächlich erreichte Leistung.", "Durchsatz ist immer größer als die Bandbreite.", "Bandbreite wird nur bei WLAN verwendet."], answer: "Bandbreite ist die theoretische Kapazität, Durchsatz die tatsächlich erreichte Leistung.", exp: "Erklärung: Bandbreite bezeichnet das theoretische Maximum der Leitung (z. B. 1 Gbit/s). Der Durchsatz (Throughput) misst die tatsächliche Netto-Datenrate im Betrieb unter Berücksichtigung von Overhead und Auslastung." },
    { type: "mc", q: " 52: Ein Netzwerk hat eine Bandbreite von 1 Gbit/s. Gemessen werden 850 Mbit/s. Welche Aussage trifft zu?", options: ["Der Durchsatz beträgt 1 Gbit/s.", "Die Bandbreite beträgt 850 Mbit/s.", "Der Durchsatz beträgt 850 Mbit/s.", "Das Netzwerk ist defekt."], answer: "Der Durchsatz beträgt 850 Mbit/s.", exp: "Erklärung: Der real gemessene Wert im Betrieb entspricht dem Durchsatz (850 Mbit/s), während die nominale Kapazität (1 Gbit/s) die Bandbreite ist." },
    { type: "mc", q: " 53: Welche Einheit wird normalerweise für Netzwerkgeschwindigkeiten verwendet?", options: ["Byte", "Volt", "Bit pro Sekunde", "Hertz"], answer: "Bit pro Sekunde", exp: "Erklärung: Datenübertragungsraten in Netzwerken werden standardmäßig in Bit pro Sekunde (bit/s, Mbit/s, Gbit/s) gemessen. Speicherkapazitäten dagegen in Byte." },
    { type: "mc", q: " 54: Eine Datei ist 8 GB groß. Wie viele Gigabit entsprechen diesem Wert?", options: ["8 Gbit", "16 Gbit", "32 Gbit", "64 Gbit"], answer: "64 Gbit", exp: "Erklärung: 1 Byte besteht aus 8 Bits. Rechnungsansatz: 8 Gigabyte * 8 Bit = 64 Gigabit." },
    { type: "mc", q: " 55: Welche Aussage über Ethernet stimmt?", options: ["Ethernet verwendet MAC-Adressen.", "Ethernet arbeitet auf OSI-Schicht 7.", "Ethernet nutzt ausschließlich Glasfaser.", "Ethernet verwendet keine Frames."], answer: "Ethernet verwendet MAC-Adressen.", exp: "Erklärung: Ethernet ist die dominierende Schicht-2-Technologie und nutzt physikalische 48-Bit MAC-Adressen zur Adressierung von Datenpaketen (Frames)." },
    { type: "mc", q: " 56: Welche Komponente prüft die Ziel-MAC-Adresse eines Ethernet-Frames?", options: ["Switch", "Patchpanel", "Netzteil", "USV"], answer: "Switch", exp: "Erklärung: Ein Layer-2-Switch bewertet die Ziel-MAC im Ethernet-Header, um das Paket gezielt an den richtigen Port weiterzuleiten." },
    { type: "mc", q: " 57: Welches Feld eines Ethernet-Frames enthält die eigentlichen Nutzdaten?", options: ["FCS", "Payload", "SFD", "EtherType"], answer: "Payload", exp: "Erklärung: Der Payload-Bereich trägt die Nutzdaten der höheren Schichten (z. B. das IP-Paket). Er umfasst zwischen 46 und 1500 Bytes." },
    { type: "mc", q: " 58: Welche Aufgabe besitzt die FCS im Ethernet-Frame?", options: ["Verschlüsselung", "Fehlererkennung", "Komprimierung", "Routing"], answer: "Fehlererkennung", exp: "Erklärung: Die Frame Check Sequence (FCS) beinhaltet einen 32-Bit CRC-Prüfwert, mit dem der Empfänger prüft, ob Übertragungsfehler vorliegen." },
    { type: "mc", q: " 59: Welche maximale Standard-MTU wird bei Ethernet normalerweise verwendet?", options: ["512 Byte", "1024 Byte", "1500 Byte", "9000 Byte"], answer: "1500 Byte", exp: "Erklärung: Die Maximum Transmission Unit (MTU) für Standard-Ethernet beträgt 1500 Bytes Payload (ohne Ethernet-Header)." },
    { type: "mc", q: " 60: Eine Datei wird in viele kleinere Ethernet-Frames zerlegt. Warum geschieht das?", options: ["Weil die MTU begrenzt ist", "Weil MAC-Adressen zu kurz sind", "Weil Ethernet keine Nutzdaten übertragen kann", "Weil Switches keine großen Dateien unterstützen"], answer: "Weil die MTU begrenzt ist", exp: "Erklärung: Da ein Ethernet-Frame maximal 1500 Byte Nutzlast transportieren kann, müssen größere Datensätze (z. B. Dateien) in viele kleinere Segmente/Pakete fragmentiert werden." },
    { type: "mc", q: " 61: Ein Benutzer erhält nach dem Einschalten des PCs automatisch eine gültige IP-Adresse. Welcher Dienst war dafür verantwortlich?", options: ["DNS", "DHCP", "HTTP", "FTP"], answer: "DHCP", exp: "Erklärung: Dynamic Host Configuration Protocol (DHCP) verteilt automatisiert IP-Adressen, Subnetzmasken und Standard-Gateways an Clients." },
    { type: "mc", q: " 62: Ein Benutzer kennt nur den Namen eines Servers. Welcher Dienst hilft bei der Ermittlung der IP-Adresse?", options: ["DNS", "DHCP", "ARP", "TCP"], answer: "DNS", exp: "Erklärung: Das Domain Name System (DNS) löst Hostnamen in die dazugehörigen IP-Adressen auf." },
    { type: "mc", q: " 63: Ein Administrator möchte einen ausgeschalteten PC über das Netzwerk starten. Welche Technik wird verwendet?", options: ["VLAN", "Wake-on-LAN", "DHCP", "NAT"], answer: "Wake-on-LAN", exp: "Erklärung: Wake-on-LAN (WoL) sendet ein spezielles Aufweck-Paket (Magic Packet) an die Netzwerkarte des ausgeschalteten PCs." },
    { type: "mc", q: " 64: Warum wird bei Wake-on-LAN die MAC-Adresse verwendet?", options: ["Der ausgeschaltete PC besitzt keine aktive IP-Kommunikation.", "Die MAC-Adresse ist schneller.", "Die IP-Adresse ist zu lang.", "DHCP funktioniert sonst nicht."], answer: "Der ausgeschaltete PC besitzt keine aktive IP-Kommunikation.", exp: "Erklärung: Da das Betriebssystem heruntergefahren ist, ist kein IP-Stapel aktiv. Nur die Netzwerkkarte verarbeitet auf Schicht 2 Daten anhand ihrer festen MAC-Adresse." },
    { type: "mc", q: " 65: Ein Unternehmen möchte mehrere Access Points mit Strom versorgen, ohne zusätzliche Steckdosen zu installieren. Welche Technik eignet sich dafür?", options: ["DNS", "TCP", "PoE", "OSPF"], answer: "PoE", exp: "Erklärung: Power over Ethernet (PoE) führt Gleichstrom direkt über das RJ45-Netzwerkkabel zu den Endgeräten." },
    { type: "mc", q: " 66: Nach Installation eines neuen Access Points startet das Gerät nicht. Welche Ursache ist am wahrscheinlichsten?", options: ["DNS-Eintrag fehlt", "PoE wird nicht bereitgestellt", "Browser nicht aktuell", "DHCP deaktiviert"], answer: "PoE wird nicht bereitgestellt", exp: "Erklärung: Startet ein PoE-Gerät ohne separates Netzteil überhaupt nicht, liefert der Switch-Port keine PoE-Versorgungsspannung." },
    { type: "mc", q: " 67: Ein Netzwerk verwendet Cat 5e. Welche Datenrate ist typischerweise möglich?", options: ["1 Gbit/s", "10 Gbit/s über 100 m", "40 Gbit/s", "100 Gbit/s"], answer: "1 Gbit/s", exp: "Erklärung: Kategorie 5e (Cat 5e) ist für Übertragungsfrequenzen bis 100 MHz spezifiziert und unterstützt Gigabit-Ethernet (1 Gbit/s) bis 100 m." },
    { type: "mc", q: " 68: Ein Unternehmen möchte 10 Gbit/s über 100 m Kupfer übertragen. Welche Kabelkategorie eignet sich am besten?", options: ["Cat 5", "Cat 5e", "Cat 6a", "Cat 3"], answer: "Cat 6a", exp: "Erklärung: Kategorie 6a (Cat 6a) ist bis 500 MHz spezifiziert und sichert den Betrieb von 10GBASE-T über die volle Distanz von 100 Metern." },
    { type: "mc", q: " 69: Ein Netzwerktechniker entdeckt ein U/UTP-Kabel. Welche Aussage trifft zu?", options: ["Gesamtschirm vorhanden", "Paarschirm vorhanden", "Keine Schirmung vorhanden", "Glasfaserkabel"], answer: "Keine Schirmung vorhanden", exp: "Erklärung: U/UTP steht für Unshielded / Unshielded Twisted Pair – weder der Gesamtmantel noch die einzelnen Adernpaare besitzen eine Metallschirmung." },
    { type: "mc", q: " 70: Ein Mitarbeiter knickt ein Netzwerkkabel sehr stark. Welche Folge kann auftreten?", options: ["Verbesserter Durchsatz", "Erhöhte Signalstörungen", "Höhere Bandbreite", "Kürzere MAC-Adresse"], answer: "Erhöhte Signalstörungen", exp: "Erklärung: Starkes Knicken verändert die Verdrillung und Geometrie der Adern, was zu Wellenwiderstandsänderungen, Signalreflexionen und hoher Dämpfung führt." },
    { type: "mc", q: " 71: Welche Abkürzung steht für Gebäudeverteiler?", options: ["EV", "SV", "GV", "AP"], answer: "GV", exp: "Erklärung: In der strukturierten Verkabelung steht GV für Gebäudeverteiler (Primärbereich)." },
    { type: "mc", q: " 72: Welche Abkürzung steht für Etagenverteiler?", options: ["EV", "GV", "SV", "AP"], answer: "EV", exp: "Erklärung: EV steht für Etagenverteiler (Tertiärbereich). SV steht für Standortverteiler." },
    { type: "mc", q: " 73: Wo befindet sich typischerweise ein Patchpanel?", options: ["Arbeitsplatz", "Etagenverteiler", "Monitor", "Drucker"], answer: "Etagenverteiler", exp: "Erklärung: Das Patchpanel ist im Verteilerschrank des Etagenverteilers (EV) eingebaut und schließt die Verlegekabel ab." },
    { type: "mc", q: " 74: Welche Aussage über ein Patchpanel ist richtig?", options: ["Es verteilt aktiv Daten.", "Es benötigt eine eigene IP-Adresse.", "Es ist eine passive Komponente.", "Es arbeitet als Router."], answer: "Es ist eine passive Komponente.", exp: "Erklärung: Ein Patchpanel benötigt keinen elektrischen Strom und ist ein rein passives Verbindungselement zum Auflegen fester Verlegekabel." },
    { type: "mc", q: " 75: Welche Topologie wird bei der strukturierten Verkabelung verwendet?", options: ["Bus", "Ring", "Hierarchischer Stern", "Full Mesh"], answer: "Hierarchischer Stern", exp: "Erklärung: Die Norm EN 50173 fordert eine hierarchische Sterntopologie (Standortverteiler -> Gebäudeverteiler -> Etagenverteiler -> Endgerät)." },

let currentQ = 0;
let score = 0;
let currentShuffledOptions = [];

function showQuestion() {
    const q = questions[currentQ];
    document.getElementById("progress").innerText = `Frage ${currentQ + 1} von ${questions.length}`;
    const container = document.getElementById("question-content");
    const feedback = document.getElementById("feedback-area");
    feedback.innerHTML = "";
    document.getElementById("next-btn").style.display = "none";

    let html = `<div class="question-text">${q.q}</div>`;

    if (q.img) {
        html += `<div class="q-image-container">${q.img}</div>`;
    }

    currentShuffledOptions = shuffleArray(q.options);
    html += `<div id="options-container">`;
    currentShuffledOptions.forEach((opt, idx) => {
        html += `<button class="option" onclick="checkMC(${idx})">${opt}</button>`;
    });
    html += `</div>`;

    container.innerHTML = html;
}

function checkMC(selectedIndex) {
    const q = questions[currentQ];
    const selectedOption = currentShuffledOptions[selectedIndex];
    const optionsBtns = document.querySelectorAll(".option");
    optionsBtns.forEach(btn => btn.disabled = true);

    if (selectedOption === q.answer) {
        optionsBtns[selectedIndex].classList.add("correct");
        score++;
        showFeedback(true, `Richtig!\n\n${q.exp}`);
    } else {
        optionsBtns[selectedIndex].classList.add("incorrect");
        currentShuffledOptions.forEach((opt, idx) => {
            if (opt === q.answer) {
                optionsBtns[idx].classList.add("correct");
            }
        });
        showFeedback(false, `Falsch! Richtige Antwort: ${q.answer}\n\n${q.exp}`);
    }
    document.getElementById("next-btn").style.display = "inline-block";
}

function showFeedback(isCorrect, text) {
    const feedback = document.getElementById("feedback-area");
    feedback.className = `feedback ${isCorrect ? 'feedback-correct' : 'feedback-incorrect'}`;
    
    const memeArray = isCorrect ? correctMemes : incorrectMemes;
    const randomMeme = memeArray[Math.floor(Math.random() * memeArray.length)];

    feedback.innerHTML = `
        <div style="white-space: pre-line;">${text}</div>
        <div class="feedback-img">
            <img src="${randomMeme}" alt="Reaktion Bild">
        </div>
    `;
}

function nextQuestion() {
    currentQ++;
    if (currentQ < questions.length) {
        showQuestion();
    } else {
        finishQuiz();
    }
}

function getRangliste() {
    const data = localStorage.getItem(`lf03_rangliste_95_v1`);
    if (data) {
        return JSON.parse(data);
    }
    return [
        { name: "Netzwerk-Profi", score: 91, max: 95, date: "17.09.2026" },
        { name: "SysAdmin_2026", score: 83, max: 95, date: "17.09.2026" }
    ];
}

function saveRanglisteEntry(name) {
    if (!name || name.trim() === "") return;
    let list = getRangliste();
    const today = new Date().toLocaleDateString('de-DE');
    list.push({
        name: name.trim(),
        score: score,
        max: questions.length,
        date: today
    });
    list.sort((a, b) => b.score - a.score);
    list = list.slice(0, 10);
    localStorage.setItem(`lf03_rangliste_95_v1`, JSON.stringify(list));
    renderRangliste(name.trim());
}

function renderRangliste(highlightName = null) {
    const list = getRangliste();
    let html = `
        <table class="rangliste-table">
            <tr>
                <th>Rang</th>
                <th>Name</th>
                <th>Punkte</th>
                <th>Prozent</th>
                <th>Datum</th>
            </tr>
    `;
    list.forEach((item, index) => {
        const isCurrent = highlightName && item.name === highlightName && item.score === score;
        const rowClass = isCurrent ? 'class="highlight-row"' : '';
        const pct = Math.round((item.score / item.max) * 100);
        html += `
            <tr ${rowClass}>
                <td><strong>#${index + 1}</strong></td>
                <td>${item.name}</td>
                <td>${item.score} / ${item.max}</td>
                <td>${pct}%</td>
                <td>${item.date}</td>
            </tr>
        `;
    });
    html += `</table>`;
    document.getElementById("rangliste-table-container").innerHTML = html;
}

function finishQuiz() {
    const passed = score >= (questions.length / 2);
    
    const imgSrc = passed 
        ? "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExeTg2NGxudjlweDQzaWV0a3ljdmQwaDhwbWVpM250MTRqb3dpdDRjciZlcD12MV9naWZzX3NlYXJjaCZjdD1n/3o7qE2VAxuXWeyvJIY/giphy.webp"
        : "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdzgxbGplZnkzdnFhanE2M3d5bDIybTZiN2J1Zm1qbzk4OHppdGdudyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l1J9u3TZfpmeDLkD6/giphy.gif";

    document.getElementById("quiz-card").innerHTML = `
        <div id="score-board">
            <h2>Lernzielkontrolle LF03 Beendet!</h2>
            <p style="font-size: 1.3em;">Ergebnis: <strong>${score}</strong> von <strong>${questions.length}</strong> Punkten (${Math.round(score/questions.length*100)}%)</p>
            <div class="img-container">
                <img src="${imgSrc}" alt="Ergebnis Bild">
            </div>
            <div class="meme-text">${passed ? 'Herzlichen Glückwunsch! Du bist bestens auf die LF03 IHK-Prüfung vorbereitet! 🎉' : 'Das war leider noch nicht ausreichend. Geh die Themen noch einmal durch! 😭'}</div>
            
            <div class="rangliste-container">
                <h3>🏆 Rangliste LF03 (95 Fragen)</h3>
                <div class="rangliste-form" id="rangliste-form-box">
                    <input type="text" id="player-name" placeholder="Deinen Namen eintragen..." autocomplete="off">
                    <button class="submit-btn" style="margin-top:0;" onclick="submitScore()">In Rangliste eintragen</button>
                </div>
                <div id="rangliste-table-container"></div>
            </div>
            
            <button class="submit-btn" onclick="location.reload()" style="margin-top:20px;">Test erneut starten</button>
        </div>
    `;
    
    renderRangliste();
}

function submitScore() {
    const nameInput = document.getElementById("player-name");
    if (nameInput && nameInput.value.trim() !== "") {
        saveRanglisteEntry(nameInput.value);
        document.getElementById("rangliste-form-box").style.display = "none";
    }
}

showQuestion();
</script>
